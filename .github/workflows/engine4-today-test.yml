name: Engine 4 Today Full-Cycle Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/engine4-today-test.yml'
      - 'engine4_pipeline_runner.py'
      - 'engine4_pipeline_runner_guarded.py'
      - 'engine4_final_guard.py'
      - 'engine4_free_providers.py'
      - 'engine4_score.py'
      - 'ENGINE4_SSOT.md'
  workflow_dispatch:

jobs:
  today-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify free-provider health first
        run: python engine4_pipeline_runner_guarded.py provider-smoke
      - name: Run complete Engine 4 test using today's ET market date
        shell: bash
        run: |
          set -euo pipefail
          TODAY=$(TZ=America/New_York date +%F)
          echo "TODAY_ET=${TODAY}"
          echo '=== STAGE 1 PRE-SCREEN ==='
          python engine4_pipeline_runner_guarded.py prescreen --date "$TODAY"
          echo '=== STAGE 2 DEEP 100-POINT ANALYSIS ==='
          python engine4_pipeline_runner_guarded.py deep --date "$TODAY"
          echo '=== STAGE 3 09:18 REFRESH + RANK + FREEZE ==='
          python engine4_pipeline_runner_guarded.py refresh --date "$TODAY"
          echo '=== STAGE 4 FINAL LIVE CONFIRMATION ==='
          python engine4_pipeline_runner_guarded.py final --date "$TODAY"
          echo '=== TIMELINE ==='
          cat output/engine4/timeline.txt
          echo '=== HONEST FUNNEL COUNTS ==='
          python - <<'PY'
          import json
          from pathlib import Path
          pre=json.loads(Path('output/engine4/prescreen_report.json').read_text())
          deep=json.loads(Path('output/engine4/deep_ranked.json').read_text())
          top=json.loads(Path('output/engine4/top25_frozen.json').read_text())
          print('baseline_eligible', pre['baseline_eligible'])
          print('trustworthy_observed', pre['trustworthy_observed'])
          print('natural_broad_qualified', pre['broad_qualified'])
          print('nasdaq_premarket_enriched', pre.get('nasdaq_premarket_enriched'))
          print('nonzero_premarket_activity_count', pre.get('nonzero_premarket_activity_count'))
          print('strict_activity_count', pre['strict_activity_count'])
          print('retained_by_top100_cap', pre['retained_by_cap'])
          print('selected_for_deep_top60_cap', deep['selected_for_deep'])
          print('actually_analyzed', deep['analyzed_count'])
          print('score70_count', deep['score70_count'])
          print('b_grade_count', deep['b_grade_count'])
          print('strict_a_grade_count', deep['a_grade_count'])
          print('frozen_final_scan_count', top['actual_count'])
          PY
          echo '=== TOP 10 FINALISTS ==='
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('output/engine4/top25_frozen.json').read_text())
          for row in p['candidates'][:10]:
              print(f"#{row['rank']} {row['ticker']} | score={row.get('score')} | grade={row.get('premarket_grade')} | pmVol={row.get('premarket_volume')} | intensity={row.get('premarket_volume_intensity_pct')}% | spread={row.get('spread_pct')}% | failures={row.get('premarket_failures','')}")
          PY
          echo '=== FINAL RESULT ==='
          cat output/engine4/final_alert.txt
      - name: Verify all stages, providers, and live trigger guard
        shell: bash
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          pre=json.loads(Path('output/engine4/prescreen_report.json').read_text())
          deep=json.loads(Path('output/engine4/deep_ranked.json').read_text())
          top=json.loads(Path('output/engine4/top25_frozen.json').read_text())
          final=json.loads(Path('output/engine4/final_signal.json').read_text())
          tl=json.loads(Path('output/engine4/timeline.json').read_text())
          audit=json.loads(Path('output/engine4/final_live_audit.json').read_text())
          assert pre['trustworthy_observed'] > 0
          assert pre['broad_qualified'] == pre['trustworthy_observed']
          assert pre['nasdaq_premarket_enriched'] > 0, pre
          assert pre['nonzero_premarket_activity_count'] > 0, pre
          assert 0 < pre['retained_by_cap'] <= 100
          assert 0 < deep['selected_for_deep'] <= 60
          assert deep['analyzed_count'] > 0
          rows=deep['ranked']
          finite_spreads=sum(1 for r in rows if isinstance(r.get('spread_pct'),(int,float)) and math.isfinite(r['spread_pct']))
          real_pm_vol=sum(1 for r in rows if isinstance(r.get('premarket_volume'),(int,float)) and r['premarket_volume']>0)
          intensity=sum(1 for r in rows if isinstance(r.get('premarket_volume_intensity_pct'),(int,float)) and math.isfinite(r['premarket_volume_intensity_pct']))
          assert finite_spreads >= max(5, len(rows)//2), (finite_spreads,len(rows))
          assert real_pm_vol >= max(5, len(rows)//2), (real_pm_vol,len(rows))
          assert intensity >= max(5, len(rows)//2), (intensity,len(rows))
          assert all(r.get('spread_source') == 'Nasdaq quote' for r in rows if r.get('spread_pct') is not None)
          assert all(r.get('catalyst_source') == 'Google News RSS' for r in rows)
          assert 0 < top['actual_count'] <= 25
          assert len(top['candidates'][:10]) > 0
          assert final['status'] in {'BUY','WATCH','NO_TRADE'}
          if final['status'] == 'BUY':
              assert final['live_price'] >= final['entry_trigger'], final
              assert final['live_price'] <= final['max_allowed_buy_price'], final
              assert final.get('reason') == 'live_trigger_confirmed', final
          elif final['status'] == 'WATCH':
              assert final['live_price'] < final['entry_trigger'], final
              assert final.get('reason') == 'trigger_not_reached', final
          elif final.get('reason') == 'entry_missed':
              assert final.get('message') == 'NO TRADE — entry missed / breakout failed.', final
          for r in audit['candidates']:
              if r.get('pass') is True and 'current_live_price' in r:
                  assert r['current_live_price'] >= r['entry_trigger']
                  assert r['current_live_price'] <= r['max_allowed_buy_price']
          stages=[e['stage'] for e in tl['events']]
          required=['PRE-SCREEN','DEEP 100-POINT ANALYSIS','09:18 REFRESH + RANKING','TOP-25 FREEZE','FINAL 09:45 LIVE CONFIRMATION']
          for s in required:
              assert s in stages, s
          print('ENGINE4_LIVE_TRIGGER_GUARD_FULL_CYCLE_PASS')
          print('final_status', final['status'])
          print('final_reason', final.get('reason'))
          print('final_live_price', final.get('live_price'))
          print('final_trigger', final.get('entry_trigger'))
          print('finite_spreads',finite_spreads,'of',len(rows))
          print('real_pm_vol',real_pm_vol,'of',len(rows))
          print('volume_intensity',intensity,'of',len(rows))
          PY
