name: Crash Rebound Targeted Expansion Outcomes

on:
  push:
    branches: [main]
    paths:
      - 'crash_rebound/targeted_expansion_probable_overreaction_preoutcome.csv'
      - '.github/workflows/crash-rebound-targeted-expansion-outcomes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  outcomes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install market data dependency
        run: pip install yfinance pandas --quiet
      - name: Build outcomes
        shell: python
        run: |
          import csv, pathlib, math
          import pandas as pd
          import yfinance as yf

          src_path=pathlib.Path("crash_rebound/targeted_expansion_probable_overreaction_preoutcome.csv")
          rows=list(csv.DictReader(src_path.open()))
          out=[]
          for r in rows:
              ticker=r["ticker"]
              date=pd.Timestamp(r["crash_date"])
              df=yf.download(ticker,start=(date-pd.Timedelta(days=10)).strftime("%Y-%m-%d"),end=(date+pd.Timedelta(days=70)).strftime("%Y-%m-%d"),auto_adjust=False,progress=False,threads=False)
              if df.empty:
                  out.append({**r,"status":"MISSING_DATA"})
                  continue
              if isinstance(df.columns,pd.MultiIndex):
                  df.columns=df.columns.get_level_values(0)
              df.index=pd.to_datetime(df.index).tz_localize(None)
              if date not in df.index:
                  out.append({**r,"status":"MISSING_CRASH_BAR"})
                  continue
              i=df.index.get_loc(date)
              post=df.iloc[i+1:]
              crash_close=float(df.iloc[i]["Close"])
              def ret(n):
                  if len(post)<n:return ""
                  return (float(post.iloc[n-1]["Close"])/crash_close-1)*100
              def md(n):
                  if len(post)<n:return ""
                  return (float(post.iloc[:n]["Low"].min())/crash_close-1)*100
              vals={n:ret(n) for n in [1,3,5,10]}
              out.append({**r,
                "crash_close_yahoo":round(crash_close,6),
                "day1_pct":"" if vals[1]=="" else round(vals[1],4),
                "day3_pct":"" if vals[3]=="" else round(vals[3],4),
                "day5_pct":"" if vals[5]=="" else round(vals[5],4),
                "day10_pct":"" if vals[10]=="" else round(vals[10],4),
                "max_additional_downside_10d_pct":"" if md(10)=="" else round(md(10),4),
                "status":"COMPLETE" if vals[10]!="" else "INCOMPLETE",
                "outcome_source":"Yahoo Finance daily bars via yfinance"
              })
          fields=list(out[0].keys())
          op=pathlib.Path("crash_rebound/targeted_expansion_outcomes.csv")
          with op.open("w",newline="") as f:
              w=csv.DictWriter(f,fieldnames=fields);w.writeheader();w.writerows(out)
          complete=[x for x in out if x["status"]=="COMPLETE"]
          def med(key):
              v=sorted(float(x[key]) for x in complete if x[key]!="")
              if not v:return None
              n=len(v);return v[n//2] if n%2 else (v[n//2-1]+v[n//2])/2
          for key in ["day1_pct","day3_pct","day5_pct","day10_pct","max_additional_downside_10d_pct"]:
              vals=[float(x[key]) for x in complete if x[key]!=""]
              wins=sum(v>0 for v in vals)
              print(key,"N",len(vals),"WIN_PCT",round(100*wins/len(vals),2) if vals else None,"MEDIAN",round(med(key),4) if vals else None)
          print("COMPLETE",len(complete),"OF",len(out))

      - name: Commit outcomes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crash_rebound/targeted_expansion_outcomes.csv
          git diff --cached --quiet && exit 0
          git commit -m "Crash Rebound: add targeted expansion outcomes"
          git push
