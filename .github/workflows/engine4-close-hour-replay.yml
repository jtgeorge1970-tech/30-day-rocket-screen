name: Engine 4 Close-Hour Replay

on:
  push:
    paths:
      - '.github/engine4-close-hour-trigger.txt'
  workflow_dispatch:

jobs:
  close-hour-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ENGINE4_CLOSE_DATE_ET: '2026-09-21'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Compile replay runner
        run: python -m py_compile engine4_close_hour_replay.py
      - name: Engine 4 close-hour replay — full run
        run: python engine4_close_hour_replay.py
      - name: Verify exact date/window and complete stages
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('output/engine4/close_hour_final_report.json')
          if not p.exists():
              raise SystemExit('missing close_hour_final_report.json')
          d=json.loads(p.read_text())
          assert d['target_date_et']=='2026-09-21', d
          assert d['window_et']=='15:00-16:00', d
          assert d['status']=='REPLAY_COMPLETE', d
          assert d['stage1_observed']>0, d
          assert d['stage2_analyzed']>0, d
          print('ENGINE4_CLOSE_HOUR_VERIFY_PASS')
          print(json.dumps(d, indent=2))
          PY
      - name: Upload close-hour artifacts
        uses: actions/upload-artifact@v4
        with:
          name: engine4-close-hour-${{ github.run_id }}
          path: output/engine4/
          retention-days: 30
