name: Swing Fingerprint Research

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/swing-fingerprint-trigger.txt']

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt
      - name: Build buy-sell fingerprint dataset
        run: python swing_fingerprint_research.py
      - uses: actions/upload-artifact@v4
        with:
          name: swing-fingerprint-results-${{ github.run_id }}
          path: output/swing_fingerprint/
          if-no-files-found: error
          retention-days: 30
