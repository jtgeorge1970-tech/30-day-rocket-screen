name: Engine 4 Early Wake Controller

on:
  workflow_dispatch:
  # Run once at 07:50 ET. Both UTC equivalents are requested; the ET guard
  # admits only the correct seasonal event.
  schedule:
    - cron: '50 11 * * 1-5'  # 07:50 EDT
    - cron: '50 12 * * 1-5'  # 07:50 EST

concurrency:
  group: engine4-early-wake-controller
  cancel-in-progress: false

jobs:
  preflight-and-launch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: write
      contents: read
      issues: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      OPENPHONE_API_KEY: ${{ secrets.OPENPHONE_API_KEY }}
      OPENPHONE_FROM_NUMBER: ${{ secrets.OPENPHONE_FROM_NUMBER }}
      ENGINE4_SMS_TO: ${{ secrets.ENGINE4_SMS_TO }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Verify correct early ET window
        id: window
        shell: bash
        run: |
          H=$(TZ=America/New_York date +%H)
          M=$(TZ=America/New_York date +%M)
          T=$((10#$H * 60 + 10#$M))
          echo "Early controller woke at ${H}:${M} ET"
          if [ "$T" -lt 465 ] || [ "$T" -gt 480 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Wrong seasonal duplicate; exiting harmlessly."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install notification dependency
        if: steps.window.outputs.skip != 'true'
        run: pip install requests

      - name: Send early protection notification
        if: steps.window.outputs.skip != 'true'
        run: >-
          python engine4_notify.py preflight
          --message "ENGINE 4 EARLY PROTECTION ACTIVE — preflight checks started before the production wake for $(TZ=America/New_York date +%F) ET."

      - name: Run preflight tests and provider verification
        if: steps.window.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          pip install -r requirements.txt pytest
          python -m py_compile engine4_intraday.py engine4_pipeline_runner_guarded.py engine4_notify.py engine4_bench.py engine4_stage_report.py
          pytest -q test_engine4_*.py
          python engine4_pipeline_runner_guarded.py provider-smoke

      - name: Wait for 08:05 ET launch checkpoint
        if: steps.window.outputs.skip != 'true'
        shell: bash
        run: |
          while true; do
            H=$(TZ=America/New_York date +%H)
            M=$(TZ=America/New_York date +%M)
            NOW=$((10#$H * 60 + 10#$M))
            if [ "$NOW" -ge 485 ]; then
              break
            fi
            sleep 15
          done

      - name: Verify production exists or dispatch early-controller wake
        if: steps.window.outputs.skip != 'true'
        id: launch
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          runs_url = f"https://api.github.com/repos/{repo}/actions/workflows/engine4-production.yml/runs?per_page=30"
          request = urllib.request.Request(runs_url, headers=headers)
          with urllib.request.urlopen(request, timeout=20) as response:
              runs = json.load(response).get("workflow_runs", [])

          et = ZoneInfo("America/New_York")
          today = datetime.now(et).date()
          existing = []
          for run in runs:
              created_at = datetime.fromisoformat(run["created_at"].replace("Z", "+00:00")).astimezone(et)
              created_minute = created_at.hour * 60 + created_at.minute
              active = run.get("status") in {"queued", "in_progress", "waiting", "pending"}
              successful = run.get("status") == "completed" and run.get("conclusion") == "success"
              if created_at.date() == today and 485 <= created_minute <= 515 and (active or successful):
                  existing.append(run)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              if existing:
                  output.write("dispatched=false\n")
                  output.write(f"verified_run={existing[0]['id']}\n")
                  print(f"ENGINE 4 PRIMARY WAKE VERIFIED — run={existing[0]['id']} status={existing[0]['status']}")
                  raise SystemExit(0)

              dispatch_url = f"https://api.github.com/repos/{repo}/actions/workflows/engine4-production.yml/dispatches"
              body = json.dumps({"ref": "main"}).encode("utf-8")
              dispatch = urllib.request.Request(
                  dispatch_url,
                  data=body,
                  headers={**headers, "Content-Type": "application/json"},
                  method="POST",
              )
              with urllib.request.urlopen(dispatch, timeout=20) as response:
                  if response.status != 204:
                      raise RuntimeError(f"Unexpected dispatch status {response.status}")
              output.write("dispatched=true\n")
              print("ENGINE 4 EARLY-CONTROLLER WAKE DISPATCHED")
          PY

      - name: Send early-controller dispatch notification
        if: steps.window.outputs.skip != 'true' && steps.launch.outputs.dispatched == 'true'
        run: >-
          python engine4_notify.py launch
          --message "ENGINE 4 EARLY CONTROLLER DISPATCHED PRODUCTION — the 08:05 ET launch checkpoint found no active production run and started one."

      - name: Send early-controller failure notification
        if: failure() && steps.window.outputs.skip != 'true'
        run: >-
          python engine4_notify.py failure
          --message "ENGINE 4 EARLY WAKE FAILURE — preflight or dispatch failed before production. The primary schedule and recovery watchdog remain armed, but review GitHub immediately."
