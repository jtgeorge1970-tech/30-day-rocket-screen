name: OFTS independent fresh oscillator chart audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'ofts/research/fresh_audit.py'
      - '.github/workflows/ofts-fresh-chart-audit.yml'
  schedule:
    - cron: '45 22 * * 1-5'
permissions:
  contents: read
jobs:
  fresh-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install own data feed and exchange calendar
        run: python -m pip install yfinance pandas pandas_market_calendars
      - name: Restore full-universe research cache for candidate identification only
        uses: actions/cache/restore@v4
        with:
          path: |
            ofts-output/universe_ohlcv.csv
            ofts-output/download_completed.txt
          key: ofts-history-identity-audit
          restore-keys: |
            ofts-history-
      - name: Rebuild research shortlist for independent refresh
        run: |
          test -s ofts-output/universe_ohlcv.csv
          python -m ofts.worker
      - name: Refresh current 30/60/126/252-session charts from provider
        run: python -m ofts.research.fresh_audit
      - name: Display CTOS and complete audited universe
        if: always()
        run: |
          if test -f ofts-output/fresh_oscillator_audit.json; then
            python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('ofts-output/fresh_oscillator_audit.json').read_text())
          print('AUDIT_TARGET',r['target_session'],'TOTAL',len(r['records']),'ERRORS',r['data_errors'])
          for row in r['records']:
              if row['symbol']=='CTOS':
                  print('CTOS_FRESH_CHART_AUDIT',json.dumps(row))
          PY
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ofts-fresh-chart-audit-${{ github.run_id }}
          path: |
            ofts-output/fresh_oscillator_audit.json
            ofts-output/fresh_oscillator_audit.csv
          if-no-files-found: warn
          retention-days: 90
