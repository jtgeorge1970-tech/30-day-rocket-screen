name: Crash Rebound April Cohort Build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/crash-rebound-april-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build April 2026 source cohort from text mirror
        shell: python
        run: |
          import csv, re, pathlib, urllib.request

          src = "https://r.jina.ai/https://www.stocktitan.net/rankings/top-news/losers/2026-04"
          req = urllib.request.Request(src, headers={"User-Agent":"Mozilla/5.0"})
          text = urllib.request.urlopen(req, timeout=60).read().decode("utf-8","replace")
          if "April 2026 Stock Losers on News: 100 Moves" not in text:
              raise SystemExit("Expected April board title not found")

          # Jina's markdown collapses each rank header into a single line:
          # 1[IMMP](... )release reads positive-82.44%03/13/2026 against ...
          rank_re = re.compile(r"(?m)^(\d{1,3})\[([A-Z][A-Z0-9]{0,5})\]\([^\n)]+\).*?(-\d+(?:\.\d+)?)%(\d{2}/\d{2}/2026) against")
          starts=list(rank_re.finditer(text))
          byrank={}
          catalysts=[
              "Clinical Trial Results","Offering / Dilution","FDA & Regulatory",
              "M&A / Acquisition","Contract / Partnership","Buyback / Dividend",
              "Leadership Change","Uplisting / Compliance","Crypto & Treasury",
              "Earnings","Other Announcement"
          ]
          for j,m in enumerate(starts):
              rank=int(m.group(1))
              if not 1 <= rank <= 100 or rank in byrank:
                  continue
              block=text[m.start():(starts[j+1].start() if j+1 < len(starts) else len(text))]
              catalyst=""
              for cand in catalysts:
                  if cand in block:
                      catalyst=cand
                      break
              # First linked headline after the ticker link.
              links=re.findall(r"\[([^\]]+)\]\(https?://[^)]+\)", block)
              announcement=links[1] if len(links)>1 else ""
              byrank[rank]={
                  "rank":rank,
                  "ticker":m.group(2),
                  "crash_date":m.group(4),
                  "crash_pct":m.group(3),
                  "catalyst":catalyst,
                  "announcement":announcement,
                  "source":"StockTitan Apr 2026 losers final board"
              }

          out=[byrank[i] for i in range(1,101) if i in byrank]
          if len(out) != 100:
              missing=[i for i in range(1,101) if i not in byrank]
              raise SystemExit(f"Acceptance gate failed: {len(out)} rows; missing={missing}")

          path=pathlib.Path("crash_rebound/april_2026_source_cohort.csv")
          path.parent.mkdir(parents=True, exist_ok=True)
          with path.open("w",newline="") as f:
              w=csv.DictWriter(f,fieldnames=list(out[0].keys()))
              w.writeheader(); w.writerows(out)
          print("MARCH_COHORT_ROWS=100")
          print("FIRST",out[0])
          print("LAST",out[-1])

      - name: Commit cohort
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crash_rebound/april_2026_source_cohort.csv
          git diff --cached --quiet && exit 0
          git commit -m "Crash Rebound: build April 2026 100-event source cohort"
          git push
