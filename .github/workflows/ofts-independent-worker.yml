name: OFTS independent full-universe worker
on:
  push:
    paths:
      - 'ofts/worker.py'
      - 'ofts/research/**'
      - '.github/workflows/ofts-independent-worker.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: read
concurrency:
  group: ofts-independent-worker
  cancel-in-progress: false
jobs:
  ofts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Score available historical universe (v2.3 research)
        run: python -m ofts.worker
      - name: Preserve status and checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ofts-status-${{ github.run_id }}
          path: ofts-output/
          if-no-files-found: warn
          retention-days: 30
