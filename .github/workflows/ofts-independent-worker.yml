name: OFTS independent full-universe worker
on:
  push:
    paths:
      - 'ofts/worker.py'
      - 'ofts/research/**'
      - '.github/workflows/ofts-independent-worker.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: read
concurrency:
  group: ofts-independent-worker
  cancel-in-progress: false
jobs:
  ofts:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install market-data provider
        run: python -m pip install --quiet yfinance pandas
      - name: Restore historical OHLC checkpoints
        uses: actions/cache@v4
        with:
          path: |
            ofts-output/universe_ohlcv.csv
            ofts-output/download_completed.txt
          key: ofts-history-${{ github.run_id }}
          restore-keys: |
            ofts-history-
      - name: Download daily OHLC for full universe
        run: python -m ofts.fetch_universe_history
      - name: Score available historical universe (v2.3 research)
        run: python -m ofts.worker
      - name: Preserve status and checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ofts-status-${{ github.run_id }}
          path: ofts-output/
          if-no-files-found: warn
          retention-days: 30
