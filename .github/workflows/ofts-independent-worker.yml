name: OFTS daily scoring and saved validation
on:
  push:
    paths:
      - 'ofts/daily.py'
      - 'ofts/audit_saved.py'
      - 'ofts/cycle_ledger.py'
      - 'ofts/test_daily.py'
      - 'ofts/test_regime.py'
      - 'ofts/test_swing_health.py'
      - 'ofts/research/swing_health.py'
      - 'ofts/research/recent_viability.py'
      - 'ofts/test_recent_viability.py'
      - 'ofts/research/security_regimes.py'
      - 'ofts/SSOT_DAILY_OPERATIONS.md'
      - '.github/workflows/ofts-independent-worker.yml'
  workflow_dispatch:
  schedule:
    # Use an off-round minute to reduce scheduled-run congestion; workflow-file
    # changes also trigger an immediate recovery run through the push path.
    # Recovery trigger: 2026-10-14 UTC after the 2026-10-13 schedule did not start.
    - cron: '37 22 * * 1-5'
    # Later provider-availability retry for the same Mon-Fri market session.
    - cron: '37 1 * * 2-6'
    # Additional pre-next-open repair opportunities if the data vendor remains late.
    - cron: '37 3,10 * * 2-6'
permissions:
  contents: write
concurrency:
  group: ofts-independent-worker
  cancel-in-progress: false
jobs:
  ofts:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install market data and exchange calendar
        run: python -m pip install yfinance pandas pandas_market_calendars
      - name: Verify persistence and forward accounting
        run: python -m unittest ofts.test_daily ofts.test_regime ofts.test_swing_health ofts.test_recent_viability -v
      - name: Restore permanent state branch
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          remote_ref=$(git ls-remote --heads origin refs/heads/ofts-daily-state)
          if [ -n "$remote_ref" ]; then
            git fetch origin ofts-daily-state
            git worktree add ofts-state FETCH_HEAD
            test -f ofts-state/control.json
            test -d ofts-state/predictions
            echo "Restored durable state $(git -C ofts-state rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          else
            git worktree add --detach ofts-state
            git -C ofts-state checkout --orphan ofts-state-initial
            git -C ofts-state rm -rf .
            echo 'First initialization: durable branch did not exist.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Refresh, score, freeze predictions and evaluate outcomes
        id: daily
        if: github.ref == 'refs/heads/main'
        run: python -m ofts.daily --state ofts-state --batch-size 100
      - name: Verify minimum fresh-market-data coverage
        if: steps.daily.outcome == 'success'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          gate=json.loads(Path('ofts-state/freshness_gate.json').read_text())
          print('FRESH_DATA_GATE',gate,flush=True)
          if not gate['passed']:
              raise SystemExit('INSUFFICIENT_FRESH_DATA: fail cycle, preserve audit and retry next scheduled run')
          PY
      - name: Recompute and audit saved evidence
        if: always() && steps.daily.outcome != 'skipped'
        run: python -m ofts.audit_saved --state ofts-state
      - name: Persist results and verify remote commit
        if: always() && steps.daily.outcome != 'skipped'
        run: |
          set -euo pipefail
          test -f ofts-state/control.json
          git -C ofts-state add --all
          if ! git -C ofts-state diff --cached --quiet; then
            git -C ofts-state commit -m "OFTS dated research state $GITHUB_RUN_ID [skip ci]"
            # GitHub occasionally rejects a ref transaction transiently.
            # Retry without force; an actual concurrent/invalid update still fails.
            pushed=false
            for delay in 0 8 20 40; do
              if [ "$delay" -gt 0 ]; then sleep "$delay"; fi
              if git -C ofts-state push origin HEAD:refs/heads/ofts-daily-state; then
                pushed=true
                break
              fi
              echo "OFTS durable state push failed; retry after backoff ${delay}s" >&2
            done
            if [ "$pushed" != true ]; then
              echo "OFTS_REMOTE_SAVE_RETRY_EXHAUSTED" >&2
              exit 1
            fi
          fi
          local_sha=$(git -C ofts-state rev-parse HEAD)
          remote_sha=$(git ls-remote --heads origin refs/heads/ofts-daily-state | cut -f1)
          test "$local_sha" = "$remote_sha"
          echo "Durable save verified: $remote_sha" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve readable report backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ofts-daily-${{ github.run_id }}
          path: |
            ofts-state/REPORT.md
            ofts-state/refresh.json
            ofts-state/control.json
            ofts-state/outcomes.json
            ofts-state/validation_summary.json
            ofts-state/predictions/
            ofts-state/AUDIT_REPORT.md
            ofts-state/latest_audit.json
            ofts-state/freshness_gate.json
            ofts-state/cycle_ledger.json
            ofts-state/cycle_report_card.json
          if-no-files-found: warn
          retention-days: 90
