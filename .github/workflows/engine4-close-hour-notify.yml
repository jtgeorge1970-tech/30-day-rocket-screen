name: Engine 4 Close-Hour SMS Notifier

on:
  push:
    paths:
      - '.github/engine4-close-hour-notify-trigger.txt'
  workflow_run:
    workflows: ["Engine 4 Close-Hour Replay"]
    types: [completed]

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      OPENPHONE_API_KEY: ${{ secrets.OPENPHONE_API_KEY }}
      OPENPHONE_FROM_NUMBER: ${{ secrets.OPENPHONE_FROM_NUMBER }}
      ENGINE4_SMS_TO: ${{ secrets.ENGINE4_SMS_TO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Send immediate active-run update
        if: github.event_name == 'push'
        run: >-
          python engine4_notify.py test
          --message "ENGINE 4 CLOSE-HOUR UPDATE — Run 35652406091 is active on Sep 21, 2026 3:00-4:00 PM ET market data. Full replay is still running. Completion/failure SMS is armed."
      - name: Send terminal replay status
        if: github.event_name == 'workflow_run'
        run: >-
          python engine4_notify.py test
          --message "ENGINE 4 CLOSE-HOUR TERMINAL — Run ${{ github.event.workflow_run.id }} finished with conclusion ${{ github.event.workflow_run.conclusion }}. Source: Sep 21, 2026 3:00-4:00 PM ET market data. ${{ github.event.workflow_run.html_url }}"
