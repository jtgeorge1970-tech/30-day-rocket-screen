name: Engine 4 Push Notification Test

on:
  push:
    branches: [main]
    paths: ['.github/engine4-notify-test-trigger.txt']

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NOTIFY_DEVICE_ID: ${{ secrets.NOTIFY_DEVICE_ID }}
      NOTIFY_DEVICE_TOKEN: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
    steps:
      - name: Validate Notify secrets
        run: |
          test -n "$NOTIFY_DEVICE_ID"
          test -n "$NOTIFY_DEVICE_TOKEN"
      - name: Send Notify iPhone push test
        run: |
          stamp=$(TZ=America/New_York date '+%Y-%m-%d %I:%M:%S %p ET')
          curl --fail --silent --show-error -X POST \
            "https://push.getnotifyapp.com/notify-json/$NOTIFY_DEVICE_ID?token=$NOTIFY_DEVICE_TOKEN" \
            -H 'Content-Type: application/json' \
            -d "{"text":"Engine 4 direct push test — if you see this banner, the notification path is working — $stamp","title":"Engine 4 TEST"}"
