name: Engine 4 Ten-Check Launch Sentinel

on:
  workflow_dispatch:
  schedule:
    # Ten Eastern-morning wake/check points. Both UTC seasons are listed;
    # the ET guard below rejects the wrong-season duplicate.
    - cron: '15 12 * * 1-5'  # 08:15 EDT
    - cron: '20 12 * * 1-5'  # 08:20 EDT
    - cron: '25 12 * * 1-5'  # 08:25 EDT
    - cron: '30 12 * * 1-5'  # 08:30 EDT
    - cron: '35 12 * * 1-5'  # 08:35 EDT
    - cron: '36 12 * * 1-5'  # 08:36 EDT
    - cron: '38 12 * * 1-5'  # 08:38 EDT
    - cron: '40 12 * * 1-5'  # 08:40 EDT
    - cron: '42 12 * * 1-5'  # 08:42 EDT
    - cron: '44 12 * * 1-5'  # 08:44 EDT
    - cron: '15 13 * * 1-5'  # 08:15 EST
    - cron: '20 13 * * 1-5'  # 08:20 EST
    - cron: '25 13 * * 1-5'  # 08:25 EST
    - cron: '30 13 * * 1-5'  # 08:30 EST
    - cron: '35 13 * * 1-5'  # 08:35 EST
    - cron: '36 13 * * 1-5'  # 08:36 EST
    - cron: '38 13 * * 1-5'  # 08:38 EST
    - cron: '40 13 * * 1-5'  # 08:40 EST
    - cron: '42 13 * * 1-5'  # 08:42 EST
    - cron: '44 13 * * 1-5'  # 08:44 EST

concurrency:
  group: engine4-ten-check-launch-sentinel
  cancel-in-progress: false

jobs:
  sentinel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Verify Eastern morning window and require real run after 08:36
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          et = ZoneInfo("America/New_York")
          now = datetime.now(et)
          minute = now.hour * 60 + now.minute
          if minute < 495 or minute > 529:
              print(f"WRONG-SEASON/OUTSIDE-WINDOW SKIP — {now:%H:%M} ET")
              raise SystemExit(0)

          def runs_for(workflow):
              url = f"https://api.github.com/repos/{repo}/actions/workflows/{workflow}/runs?per_page=30"
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.load(response).get("workflow_runs", [])

          production_runs = runs_for("engine4-production.yml")
          manual_runs = runs_for("engine4-manual-on-demand.yml")
          today = now.date()

          def is_live_manual(run):
              # Only the auditable push trigger containing mode=live_today counts.
              # Acceptance/preflight workflow_dispatch runs must never satisfy the
              # morning production proof gate.
              if run.get("event") != "push":
                  return False
              ref = run.get("head_sha") or ""
              url = f"https://api.github.com/repos/{repo}/contents/.github/engine4-manual-trigger.txt?ref={ref}"
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=20) as response:
                      payload = json.load(response)
                  import base64
                  trigger = base64.b64decode(payload.get("content","")).decode("utf-8", errors="replace")
                  return "mode=live_today" in trigger
              except Exception as exc:
                  print(f"Could not classify manual run {run.get('id')}: {exc}")
                  return False

          valid = []
          for run in production_runs + manual_runs:
              created = datetime.fromisoformat(run["created_at"].replace("Z","+00:00")).astimezone(et)
              active = run.get("status") in {"queued","in_progress","waiting","pending"}
              successful = run.get("status") == "completed" and run.get("conclusion") == "success"
              is_production = "engine4-production.yml" in str(run.get("path") or "")
              live_manual = "engine4-manual-on-demand.yml" in str(run.get("path") or "") and is_live_manual(run)
              if created.date() == today and (active or successful) and (is_production or live_manual):
                  valid.append(run)

          if valid:
              run = sorted(valid, key=lambda r: r["created_at"], reverse=True)[0]
              print(f"REAL ENGINE 4 RUN VERIFIED — id={run['id']} status={run['status']} event={run['event']} created={run['created_at']}")
              raise SystemExit(0)

          if minute < 516:
              print(f"PRE-LAUNCH SENTINEL AWAKE — {now:%H:%M} ET; no run required yet.")
              raise SystemExit(0)

          # 08:36 ET or later: absence of a real run is actionable.
          # Use the auditable push trigger so later checks can prove this was
          # specifically mode=live_today rather than an acceptance/preflight run.
          trigger_path = ".github/engine4-manual-trigger.txt"
          content_url = f"https://api.github.com/repos/{repo}/contents/{trigger_path}"
          req = urllib.request.Request(content_url, headers=headers)
          with urllib.request.urlopen(req, timeout=20) as response:
              current_file = json.load(response)
          trigger_text = (
              "mode=live_today\n"
              "acceptance_date_et=\n"
              f"request=sentinel_{now:%Y-%m-%dT%H:%M:%S%z}\n"
          )
          import base64
          body = json.dumps({
              "message": f"Engine 4 sentinel live_today wake {now:%Y-%m-%d %H:%M} ET",
              "content": base64.b64encode(trigger_text.encode()).decode(),
              "sha": current_file["sha"],
              "branch": "main",
          }).encode()
          put = urllib.request.Request(
              content_url, data=body,
              headers={**headers,"Content-Type":"application/json"},
              method="PUT",
          )
          with urllib.request.urlopen(put, timeout=20) as response:
              if response.status not in {200,201}:
                  raise RuntimeError(f"manual trigger update returned {response.status}")
          print(f"MANUAL live_today PUSH TRIGGERED BY SENTINEL — {now:%H:%M} ET")

          # Immediate proof check. Later sentinel wakes retry safely if GitHub has not created a run.
          confirm = runs_for("engine4-manual-on-demand.yml")
          todays = []
          for run in confirm:
              created = datetime.fromisoformat(run["created_at"].replace("Z","+00:00")).astimezone(et)
              if (
                  created.date() == today
                  and is_live_manual(run)
                  and run.get("status") in {"queued","in_progress","waiting","pending","completed"}
              ):
                  todays.append(run)
          if todays:
              run = sorted(todays, key=lambda r: r["created_at"], reverse=True)[0]
              print(f"MANUAL RUN ID VERIFIED — {run['id']} status={run['status']}")
          else:
              print("DISPATCH SENT BUT RUN ID NOT YET VISIBLE — later sentinel wake must recheck/retry.")
          PY
