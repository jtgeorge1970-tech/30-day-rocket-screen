name: Engine 4 Manual V2 Hardened

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/engine4-manual-v2-trigger.txt']

concurrency:
  group: engine4-production
  cancel-in-progress: true

jobs:
  live:
    if: ${{ !contains(github.event.head_commit.message, '[STOP ENGINE4]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 260
    env:
      ENGINE4_MANUAL_CURRENT_SNAPSHOT: '1'
      NOTIFY_DEVICE_ID: ${{ secrets.NOTIFY_DEVICE_ID }}
      NOTIFY_DEVICE_TOKEN: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Clean requested prior run outputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, shutil, time, urllib.request
          from pathlib import Path
          from datetime import datetime, timezone
          fields = dict(line.split("=", 1) for line in Path(".github/engine4-manual-v2-trigger.txt").read_text().splitlines() if "=" in line)
          repo = os.environ["GITHUB_REPOSITORY"]
          current = int(os.environ["GITHUB_RUN_ID"])
          token = os.environ["GH_TOKEN"]
          def api(path, method="GET"):
              req = urllib.request.Request("https://api.github.com/repos/" + repo + path, method=method,
                  headers={"Authorization": "Bearer " + token, "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"})
              with urllib.request.urlopen(req, timeout=30) as response:
                  data = response.read()
                  return json.loads(data) if data else None
          deleted = []
          for value in filter(None, fields.get("purge_run_ids", "").split(",")):
              old = int(value)
              if old == current:
                  raise RuntimeError("Refusing to purge current run")
              for attempt in range(12):
                  info = api(f"/actions/runs/{old}")
                  if info["status"] == "completed":
                      break
                  time.sleep(5)
              if info["status"] != "completed" or info["conclusion"] not in {"cancelled", "failure", "timed_out"}:
                  raise RuntimeError(f"Refusing to purge nonfailed or active run {old}")
              while True:
                  artifacts = api(f"/actions/runs/{old}/artifacts?per_page=100")["artifacts"]
                  if not artifacts:
                      break
                  for artifact in artifacts:
                      api(f"/actions/artifacts/{artifact['id']}", "DELETE")
                      deleted.append({"run_id": old, "artifact_id": artifact["id"], "name": artifact["name"]})
          out = Path("output/engine4")
          if out.exists():
              shutil.rmtree(out)
          out.mkdir(parents=True)
          manifest = {"run_id": current, "reset_at_utc": datetime.now(timezone.utc).isoformat(),
              "prior_engine4_outputs_removed": True, "deleted_artifacts": deleted,
              "bench_state_preserved_for_fresh_rescoring": True}
          (out / "fresh_start_manifest.json").write_text(json.dumps(manifest, indent=2))
          print(json.dumps(manifest, indent=2))
          PY
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt pytest
      - name: Compile/test/provider proof
        run: |
          python -m py_compile engine4_config.py engine4_data.py engine4_free_providers.py engine4_score.py engine4_live.py engine4_intraday.py engine4_pipeline.py engine4_pipeline_runner.py engine4_final_guard.py engine4_pipeline_runner_guarded.py engine4_recovery.py engine4_notify.py engine4_bench.py engine4_stage_report.py
          pytest -q test_engine4_*.py
          python engine4_pipeline_runner_guarded.py provider-smoke
      - name: Validate direct iPhone heartbeat secrets
        run: |
          test -n "$NOTIFY_DEVICE_ID"
          test -n "$NOTIFY_DEVICE_TOKEN"
      - name: Install direct 5-minute iPhone heartbeat helper
        run: |
          cat > /tmp/run_engine4_heartbeat.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          label="$1"; shift
          post_push() {
            local msg="$1"
            local payload
            payload=$(python -c 'import json,sys; print(json.dumps({"text":sys.argv[1],"title":"Engine 4 heartbeat"}))' "$msg")
            curl --fail --silent --show-error --max-time 10 --retry 1 -X POST \
              "https://push.getnotifyapp.com/notify-json/$NOTIFY_DEVICE_ID?token=$NOTIFY_DEVICE_TOKEN" \
              -H 'Content-Type: application/json' \
              -d "$payload" >/dev/null || echo "notify_heartbeat_delivery_failed"
          }
          "$@" &
          pid=$!
          next=0
          while kill -0 "$pid" 2>/dev/null; do
            now=$(date +%s)
            if [ "$now" -ge "$next" ]; then
              stamp=$(TZ=America/New_York date '+%Y-%m-%d %I:%M:%S %p ET')
              line="ENGINE4 HEARTBEAT — run ${GITHUB_RUN_ID} — ${label} RUNNING — ${stamp}"
              echo "$line"
              post_push "$line"
              next=$((now+300))
            fi
            sleep 5
          done
          wait "$pid"
          rc=$?
          stamp=$(TZ=America/New_York date '+%Y-%m-%d %I:%M:%S %p ET')
          if [ "$rc" -eq 0 ]; then
            line="ENGINE4 HEARTBEAT — run ${GITHUB_RUN_ID} — ${label} COMPLETE — ${stamp}"
          else
            line="ENGINE4 HEARTBEAT — run ${GITHUB_RUN_ID} — ${label} FAILED rc=${rc} — ${stamp}"
          fi
          echo "$line"
          post_push "$line"
          exit "$rc"
          SH
          chmod +x /tmp/run_engine4_heartbeat.sh
      - name: Enforce live window and lock date
        run: |
          H=$(TZ=America/New_York date +%H); M=$(TZ=America/New_York date +%M); T=$((10#$H * 60 + 10#$M))
          if [ "$T" -lt 485 ] || [ "$T" -gt 930 ]; then echo 'Outside 08:05-15:30 ET live window'; exit 78; fi
          echo "ENGINE_DATE_ET=$(TZ=America/New_York date +%F)" >> "$GITHUB_ENV"
          REQUESTED_AT=$(sed -n 's/^requested_at=//p' .github/engine4-manual-v2-trigger.txt)
          test -n "$REQUESTED_AT"
          echo "ENGINE4_FRESH_REQUESTED_AT=$REQUESTED_AT" >> "$GITHUB_ENV"
      - name: START notification
        run: python engine4_notify.py start --message "ENGINE 4 MANUAL RUN STARTED — current-day live on-demand cycle is active for $(TZ=America/New_York date +%F) ET."
      - name: Stage 1
        run: /tmp/run_engine4_heartbeat.sh STAGE1 bash -lc 'python engine4_pipeline_runner_guarded.py prescreen --date "$ENGINE_DATE_ET"; python engine4_stage_report.py prescreen --date "$ENGINE_DATE_ET"; python engine4_notify.py prescreen --message "$(cat output/engine4/stage_prescreen_sms.txt)"'
      - uses: actions/upload-artifact@v4
        with: {name: 'engine4-manual-v2-stage1-${{ github.run_id }}', path: 'output/engine4/', if-no-files-found: error}
      - name: Stage 2
        run: /tmp/run_engine4_heartbeat.sh STAGE2 bash -lc 'python engine4_pipeline_runner_guarded.py deep --date "$ENGINE_DATE_ET"; python engine4_stage_report.py deep --date "$ENGINE_DATE_ET"; python engine4_notify.py deep --message "$(cat output/engine4/stage_deep_sms.txt)"'
      - uses: actions/upload-artifact@v4
        with: {name: 'engine4-manual-v2-stage2-${{ github.run_id }}', path: 'output/engine4/', if-no-files-found: error}
      - name: Stage 2 qualification gate
        id: stage2_gate
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = json.loads(Path("output/engine4/deep_ranked.json").read_text())
          count = int(p.get("score80_count", 0))
          eligible = int(p.get("launchpad_eligible_count", 0))
          proceed = count > 0
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"proceed={'true' if proceed else 'false'}\n")
              fh.write(f"score80_count={count}\n")
              fh.write(f"launchpad_eligible_count={eligible}\n")
          print(f"Stage 2 gate: score80_count={count}; launchpad_eligible_count={eligible}; proceed={proceed}")
          PY
      - name: End Engine 4 when Stage 2 has zero scores >=80
        if: ${{ steps.stage2_gate.outputs.proceed != 'true' }}
        run: |
          python engine4_notify.py complete --message "ENGINE 4 ENDED AFTER STAGE 2 — zero candidates scored >=80. No Stage 3/3B/4/5 work will run."
          echo "ENGINE 4 STOPPED CLEANLY: Stage 2 produced zero score >=80 candidates."
      - name: Stage 3
        if: ${{ steps.stage2_gate.outputs.proceed == 'true' }}
        run: /tmp/run_engine4_heartbeat.sh STAGE3 bash -lc 'python engine4_pipeline_runner_guarded.py refresh --date "$ENGINE_DATE_ET"; python engine4_stage_report.py freeze --date "$ENGINE_DATE_ET"; python engine4_notify.py freeze --message "$(cat output/engine4/stage_freeze_sms.txt)"'
      - uses: actions/upload-artifact@v4
        if: ${{ steps.stage2_gate.outputs.proceed == 'true' }}
        with: {name: 'engine4-manual-v2-stage3-${{ github.run_id }}', path: 'output/engine4/', if-no-files-found: error}
      - name: Stage 3B conflict-safe
        if: ${{ steps.stage2_gate.outputs.proceed == 'true' }}
        run: /tmp/run_engine4_heartbeat.sh STAGE3B bash -lc 'python engine4_bench.py update --date "$ENGINE_DATE_ET"; python engine4_stage_report.py bench --date "$ENGINE_DATE_ET"; python engine4_notify.py bench --message "$(cat output/engine4/stage_bench_sms.txt)"'
      - uses: actions/upload-artifact@v4
        if: ${{ steps.stage2_gate.outputs.proceed == 'true' }}
        with:
          name: engine4-manual-v2-bench-${{ github.run_id }}
          path: |
            output/engine4/watch_bench*
            output/engine4/stage_bench_*
            output/engine4/notification_bench*
            state/engine4/watch_bench.json
          if-no-files-found: error
      - name: Persist fresh Bench without changing the live checkout
        if: ${{ steps.stage2_gate.outputs.proceed == 'true' }}
        continue-on-error: true
        run: |
          python -c 'import json,os; from pathlib import Path; p=json.loads(Path("state/engine4/watch_bench.json").read_text()); assert p["target_date_et"] == os.environ["ENGINE_DATE_ET"]'
          BENCH_WORKTREE="$RUNNER_TEMP/engine4-bench-persist"
          git fetch origin main
          git worktree add --detach "$BENCH_WORKTREE" origin/main
          mkdir -p "$BENCH_WORKTREE/state/engine4"
          cp state/engine4/watch_bench.json "$BENCH_WORKTREE/state/engine4/watch_bench.json"
          git -C "$BENCH_WORKTREE" config user.name 'engine4-bot'
          git -C "$BENCH_WORKTREE" config user.email 'actions@users.noreply.github.com'
          git -C "$BENCH_WORKTREE" add state/engine4/watch_bench.json
          if ! git -C "$BENCH_WORKTREE" diff --cached --quiet; then
            git -C "$BENCH_WORKTREE" commit -m "Engine 4 ${ENGINE_DATE_ET} fresh Bench run ${GITHUB_RUN_ID}"
            git -C "$BENCH_WORKTREE" pull --rebase --autostash origin main
            git -C "$BENCH_WORKTREE" push origin HEAD:main
          fi
      - name: Stage 4
        if: ${{ steps.stage2_gate.outputs.proceed == 'true' }}
        run: /tmp/run_engine4_heartbeat.sh STAGE4 bash -lc 'python engine4_pipeline_runner_guarded.py final --date "$ENGINE_DATE_ET"; python engine4_stage_report.py final --date "$ENGINE_DATE_ET"; python engine4_notify.py final'
      - uses: actions/upload-artifact@v4
        if: ${{ steps.stage2_gate.outputs.proceed == 'true' }}
        with: {name: 'engine4-manual-v2-stage4-${{ github.run_id }}', path: 'output/engine4/', if-no-files-found: error}
      - name: Stage 5
        if: ${{ steps.stage2_gate.outputs.proceed == 'true' }}
        run: /tmp/run_engine4_heartbeat.sh STAGE5 bash -lc 'python engine4_recovery.py monitor --date "$ENGINE_DATE_ET" --interval-seconds 300; python engine4_stage_report.py recovery --date "$ENGINE_DATE_ET"; python engine4_notify.py recovery'
      - name: Verify and COMPLETE
        if: ${{ steps.stage2_gate.outputs.proceed == 'true' }}
        run: |
          python engine4_stage_report.py verify-complete --date "$ENGINE_DATE_ET" --recipients 0
          python engine4_notify.py complete --message "ENGINE 4 MANUAL RUN COMPLETE — every required stage finished for ${ENGINE_DATE_ET} ET and all dated artifacts were verified."
          python engine4_stage_report.py complete --date "$ENGINE_DATE_ET" --recipients 0
      - uses: actions/upload-artifact@v4
        if: ${{ steps.stage2_gate.outputs.proceed == 'true' }}
        with: {name: 'engine4-manual-v2-complete-${{ github.run_id }}', path: 'output/engine4/', if-no-files-found: error, retention-days: 30}
      - name: FAILURE notification
        if: failure()
        run: python engine4_notify.py failure --message "ENGINE 4 DATA/PIPELINE FAILURE — manual V2 did not complete. Review failed stage; no completed result is being reported."
