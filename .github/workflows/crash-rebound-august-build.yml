name: Crash Rebound August Cohort Build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/crash-rebound-august-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependencies
        run: pip install requests beautifulsoup4
      - name: Build August 2026 cohort
        shell: python
        run: |
          import csv, re, pathlib, requests
          from bs4 import BeautifulSoup

          url = "https://www.stocktitan.net/rankings/top-news/losers/2026-08"
          html = requests.get(url, timeout=30, headers={"User-Agent":"Mozilla/5.0"}).text
          if "100 ranked drops in August 2026" not in html:
              raise SystemExit("Expected August board marker not found")

          soup = BeautifulSoup(html, "html.parser")
          out = []
          for tr in soup.find_all("tr"):
              cells = tr.find_all(["td","th"])
              if len(cells) < 5:
                  continue
              cell_text = [c.get_text(" ", strip=True) for c in cells]
              m_rank = re.fullmatch(r"\s*(\d{1,3})\s*", cell_text[0])
              if not m_rank:
                  continue
              rank = int(m_rank.group(1))
              if not 1 <= rank <= 100:
                  continue
              full = " ".join(cell_text)
              sym_match = re.search(r"\b([A-Z][A-Z0-9]{0,5})\b", cell_text[1])
              move_match = re.search(r"(-\d+(?:\.\d+)?)%", cell_text[2] if len(cell_text)>2 else full)
              date_match = re.search(r"(\d{2}/\d{2}/2026)\s+against", full)
              d1 = re.search(r"Day \+1\s+([+-]?\d+(?:\.\d+)?)%", full)
              d5 = re.search(r"Day \+5\s+([+-]?\d+(?:\.\d+)?)%", full)
              best = re.search(r"Best recovery within 5\s+([+-]?\d+(?:\.\d+)?)%", full)
              cb = re.search(r"Close before and after\s+\$?([0-9.]+)\s+to\s+\$?([0-9.]+)", full)
              rp = re.search(r"Close inside the session range\s+([0-9.]+)\s+of the range", full)
              rv = re.search(r"Relative volume\s+([0-9.]+)x", full)
              catalyst = cell_text[4] if len(cell_text)>4 else ""
              # Remove extra flag prose after catalyst label where possible.
              catalyst = re.sub(r"\s+Release reads positive.*$", "", catalyst).strip()
              out.append({
                  "rank":rank,
                  "ticker":sym_match.group(1) if sym_match else "",
                  "crash_date":date_match.group(1) if date_match else "",
                  "crash_pct":move_match.group(1) if move_match else "",
                  "catalyst":catalyst,
                  "pre_close":cb.group(1) if cb else "",
                  "crash_close":cb.group(2) if cb else "",
                  "range_position":rp.group(1) if rp else "",
                  "relative_volume":rv.group(1) if rv else "",
                  "day1_vs_preclose":d1.group(1) if d1 else "",
                  "day5_vs_preclose":d5.group(1) if d5 else "",
                  "best5_vs_preclose":best.group(1) if best else "",
                  "source":"StockTitan Aug 2026 losers final board"
              })

          # Some page builds may not expose semantic TRs. Fail rather than silently create a partial cohort.
          by_rank = {}
          for r in out:
              by_rank[r["rank"]] = r
          out = [by_rank[i] for i in sorted(by_rank)]
          if len(out) != 100 or [r["rank"] for r in out] != list(range(1,101)):
              raise SystemExit(f"Parser acceptance gate failed: got {len(out)} unique ranked rows")

          path = pathlib.Path("crash_rebound/august_2026_source_cohort.csv")
          path.parent.mkdir(parents=True, exist_ok=True)
          with path.open("w", newline="") as f:
              w = csv.DictWriter(f, fieldnames=list(out[0]))
              w.writeheader()
              w.writerows(out)

          print("AUGUST_COHORT_ROWS=100")
          print("FIRST=", out[0])
          print("LAST=", out[-1])
      - name: Commit cohort
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crash_rebound/august_2026_source_cohort.csv
          git diff --cached --quiet && exit 0
          git commit -m "Crash Rebound: build August 2026 100-event cohort"
          git push
