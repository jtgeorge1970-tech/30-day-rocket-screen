name: Engine 4 Production Wake Watchdog

on:
  workflow_dispatch:
  # Both UTC equivalents run; the ET guard admits only 08:42-08:52 ET.
  schedule:
    - cron: '42,47,52 12 * * 1-5'  # 08:42-08:52 EDT
    - cron: '42,47,52 13 * * 1-5'  # 08:42-08:52 EST

concurrency:
  group: engine4-wake-watchdog
  cancel-in-progress: false

jobs:
  verify-wake:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
      contents: read
      issues: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      OPENPHONE_API_KEY: ${{ secrets.OPENPHONE_API_KEY }}
      OPENPHONE_FROM_NUMBER: ${{ secrets.OPENPHONE_FROM_NUMBER }}
      ENGINE4_SMS_TO: ${{ secrets.ENGINE4_SMS_TO }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify correct watchdog ET window
        id: window
        shell: bash
        run: |
          H=$(TZ=America/New_York date +%H)
          M=$(TZ=America/New_York date +%M)
          T=$((10#$H * 60 + 10#$M))
          echo "Wake watchdog ran at ${H}:${M} ET"
          if [ "$T" -lt 522 ] || [ "$T" -gt 535 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Wrong seasonal duplicate; exiting harmlessly."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install notifier dependency
        if: steps.window.outputs.skip != 'true'
        run: pip install requests

      - name: Verify production wake or dispatch recovery wake
        if: steps.window.outputs.skip != 'true'
        id: wake
        shell: bash
        run: |
          python - <<'PY'
          import base64, json, os, urllib.parse, urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          runs = []
          for workflow in ("engine4-production.yml", "engine4-manual-on-demand.yml"):
              runs_url = f"https://api.github.com/repos/{repo}/actions/workflows/{workflow}/runs?per_page=30"
              request = urllib.request.Request(runs_url, headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  runs.extend(json.load(response).get("workflow_runs", []))

          et = ZoneInfo("America/New_York")
          today = datetime.now(et).date()
          existing = []
          for run in runs:
              created_at = datetime.fromisoformat(run["created_at"].replace("Z", "+00:00")).astimezone(et)
              active = run.get("status") in {"queued", "in_progress", "waiting", "pending"}
              successful = run.get("status") == "completed" and run.get("conclusion") == "success"
              is_production = "engine4-production.yml" in str(run.get("path") or "")
              is_morning_manual = False
              if (
                  "engine4-manual-on-demand.yml" in str(run.get("path") or "")
                  and run.get("event") == "push"
              ):
                  ref = urllib.parse.quote(str(run.get("head_sha") or ""), safe="")
                  content_url = (
                      f"https://api.github.com/repos/{repo}/contents/"
                      f".github/engine4-manual-trigger.txt?ref={ref}"
                  )
                  try:
                      with urllib.request.urlopen(
                          urllib.request.Request(content_url, headers=headers), timeout=20
                      ) as response:
                          encoded = json.load(response).get("content", "")
                      trigger = base64.b64decode(encoded).decode("utf-8", errors="replace")
                      is_morning_manual = "mode=live_today" in trigger
                  except Exception as exc:
                      print(f"Could not classify manual run {run.get('id')}: {exc}")
              created_minute = created_at.hour * 60 + created_at.minute
              valid_production_wake = is_production and 515 <= created_minute <= 545
              valid_morning_manual = is_morning_manual and 515 <= created_minute <= 930
              if created_at.date() == today and (active or successful) and (valid_production_wake or valid_morning_manual):
                  existing.append(run)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              if existing:
                  output.write("dispatched=false\n")
                  output.write(f"verified_run={existing[0]['id']}\n")
                  print(f"ENGINE 4 WAKE VERIFIED — run={existing[0]['id']} status={existing[0]['status']}")
                  raise SystemExit(0)

              dispatch_url = f"https://api.github.com/repos/{repo}/actions/workflows/engine4-production.yml/dispatches"
              body = json.dumps({"ref": "main"}).encode("utf-8")
              dispatch = urllib.request.Request(
                  dispatch_url,
                  data=body,
                  headers={**headers, "Content-Type": "application/json"},
                  method="POST",
              )
              with urllib.request.urlopen(dispatch, timeout=20) as response:
                  if response.status != 204:
                      raise RuntimeError(f"Unexpected dispatch status {response.status}")
              output.write("dispatched=true\n")
              print("ENGINE 4 RECOVERY WAKE DISPATCHED")
          PY

      - name: Send watchdog intervention notification
        if: steps.window.outputs.skip != 'true' && steps.wake.outputs.dispatched == 'true'
        run: >-
          python engine4_notify.py watchdog
          --message "ENGINE 4 WATCHDOG INTERVENED — no active production run was found, so the recovery wake dispatched production."

      - name: Send watchdog failure notification
        if: failure() && steps.window.outputs.skip != 'true'
        run: >-
          python engine4_notify.py failure
          --message "ENGINE 4 WAKE WATCHDOG FAILURE — neither an active production run nor a successful recovery dispatch could be verified. Review GitHub immediately; no completed engine result is being reported."
