name: Engine 4 Production Wake Watchdog

on:
  workflow_dispatch:
  # Repeated watchdog checks independently verify that production actually
  # woke. Each check dispatches a backup run when none is active or successful.
  schedule:
    - cron: '42,47,52 8 * * 1-5'
      timezone: 'America/New_York'

jobs:
  verify-wake:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      issues: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      OPENPHONE_API_KEY: ${{ secrets.OPENPHONE_API_KEY }}
      OPENPHONE_FROM_NUMBER: ${{ secrets.OPENPHONE_FROM_NUMBER }}
      ENGINE4_SMS_TO: ${{ secrets.ENGINE4_SMS_TO }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify production wake or dispatch backup
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          repo=os.environ['GITHUB_REPOSITORY']
          token=os.environ['GITHUB_TOKEN']
          headers={
              "Accept":"application/vnd.github+json",
              "Authorization":f"Bearer {token}",
              "X-GitHub-Api-Version":"2022-11-28",
          }
          runs_url=f"https://api.github.com/repos/{repo}/actions/workflows/engine4-production.yml/runs?per_page=30"
          request=urllib.request.Request(runs_url, headers=headers)
          with urllib.request.urlopen(request, timeout=20) as response:
              runs=json.load(response).get('workflow_runs', [])

          et=ZoneInfo('America/New_York')
          today=datetime.now(et).date()
          existing=[]
          for run in runs:
              created=datetime.fromisoformat(run['created_at'].replace('Z','+00:00')).astimezone(et).date()
              active=run.get('status') in {'queued','in_progress','waiting','pending'}
              successful=run.get('status') == 'completed' and run.get('conclusion') == 'success'
              if created == today and (active or successful):
                  existing.append(run)

          if existing:
              print(f"ENGINE 4 WAKE VERIFIED — run={existing[0]['id']} status={existing[0]['status']}")
              raise SystemExit(0)

          dispatch_url=f"https://api.github.com/repos/{repo}/actions/workflows/engine4-production.yml/dispatches"
          body=json.dumps({"ref":"main"}).encode('utf-8')
          dispatch=urllib.request.Request(dispatch_url, data=body, headers={**headers, "Content-Type":"application/json"}, method='POST')
          with urllib.request.urlopen(dispatch, timeout=20) as response:
              if response.status != 204:
                  raise RuntimeError(f"Unexpected dispatch status {response.status}")
          print("ENGINE 4 BACKUP WAKE DISPATCHED")
          PY

      - name: Install notifier dependency after watchdog failure
        if: failure()
        run: pip install requests

      - name: Send watchdog failure SMS
        if: failure()
        run: >-
          python engine4_notify.py failure --require-delivery
          --message "ENGINE 4 WAKE WATCHDOG FAILURE — neither the primary wake nor the backup dispatch could be verified. Review GitHub immediately; no completed engine result is being reported."
