name: Engine 4 CI + Real-Data Acceptance
on:
  push:
    branches: [engine4-intraday]
    paths:
      - 'engine4_*.py'
      - 'test_engine4_intraday.py'
      - 'ENGINE4_SSOT.md'
      - '.github/workflows/engine4-ci.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: engine4-intraday
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Compile every Engine 4 module
        run: python -m py_compile engine4_config.py engine4_data.py engine4_score.py engine4_live.py engine4_intraday.py test_engine4_intraday.py
      - name: Deterministic self test
        run: python engine4_intraday.py self-test
      - name: Unit tests
        run: pytest -q test_engine4_intraday.py
      - name: Free Yahoo data smoke test
        run: python engine4_intraday.py smoke
      - name: Full-universe historical premarket acceptance replay
        run: |
          python engine4_intraday.py premarket --date 2026-09-10
          echo '--- PREMARKET ACCEPTANCE RESULT ---'
          cat output/engine4/top25_frozen.json
      - name: Historical final-stage acceptance replay
        run: |
          python engine4_intraday.py final --date 2026-09-10
          echo '--- FINAL ACCEPTANCE RESULT ---'
          cat output/engine4/final_signal.json
      - name: Verify auditable acceptance artifacts
        run: |
          test -f output/engine4/data_smoke.json
          test -f output/engine4/top25_frozen.json
          test -f output/engine4/final_signal.json
          python - <<'PY'
          import json
          from pathlib import Path
          smoke=json.loads(Path('output/engine4/data_smoke.json').read_text())
          top=json.loads(Path('output/engine4/top25_frozen.json').read_text())
          final=json.loads(Path('output/engine4/final_signal.json').read_text())
          assert smoke['intraday_returned'] >= 10
          assert 'runtime_seconds' in top
          assert final['status'] in {'BUY','NO_TRADE'}
          if top.get('candidates'):
              assert len(top['candidates']) <= 25
              scores=[x['score'] for x in top['candidates']]
              assert scores == sorted(scores, reverse=True)
              assert min(scores) >= 70
          print('ENGINE4_REAL_DATA_ACCEPTANCE_PASS')
          print('smoke_runtime', smoke['runtime_seconds'])
          print('premarket_runtime', top['runtime_seconds'])
          print('top25_actual_count', top.get('actual_count', len(top.get('candidates',[]))))
          print('premarket_status', top.get('status','TOP25_READY'))
          print('premarket_reason', top.get('reason',''))
          print('final_runtime', final['runtime_seconds'])
          print('final_status', final['status'])
          PY
