name: Engine 4 CI + Real-Data Acceptance
on:
  push:
    branches: [main]
    paths:
      - 'engine4_*.py'
      - 'test_engine4_intraday.py'
      - 'ENGINE4_SSOT.md'
      - '.github/workflows/engine4-ci.yml'
      - '.github/workflows/engine4-production.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Compile every Engine 4 module
        run: python -m py_compile engine4_config.py engine4_data.py engine4_free_providers.py engine4_score.py engine4_live.py engine4_intraday.py engine4_pipeline.py engine4_pipeline_runner.py test_engine4_intraday.py
      - name: Deterministic self tests
        run: |
          python engine4_intraday.py self-test
          python engine4_pipeline.py self-test
          python engine4_pipeline_runner.py self-test
      - name: Unit tests
        run: pytest -q test_engine4_intraday.py
      - name: Verified free-provider smoke test
        run: python engine4_pipeline_runner.py provider-smoke
      - name: Historical staged acceptance replay — repaired runner
        shell: bash
        run: |
          set -euo pipefail
          python engine4_pipeline_runner.py prescreen --date 2026-09-10
          python engine4_pipeline_runner.py deep --date 2026-09-10
          python engine4_pipeline_runner.py refresh --date 2026-09-10
          python engine4_pipeline_runner.py final --date 2026-09-10
          cat output/engine4/timeline.txt
          cat output/engine4/final_signal.json
      - name: Verify repaired funnel accounting and provider fields
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          pre=json.loads(Path('output/engine4/prescreen_report.json').read_text())
          deep=json.loads(Path('output/engine4/deep_ranked.json').read_text())
          top=json.loads(Path('output/engine4/top25_frozen.json').read_text())
          final=json.loads(Path('output/engine4/final_signal.json').read_text())
          timeline=json.loads(Path('output/engine4/timeline.json').read_text())

          assert pre['broad_qualified'] > 0
          assert pre.get('nasdaq_premarket_enriched',0) > 0
          assert pre.get('nonzero_premarket_activity_count',0) > 0
          assert 0 < pre['retained_by_cap'] <= pre['broad_pool_cap']
          assert pre['retained_by_cap'] <= pre['broad_qualified']
          assert deep['selected_for_deep'] <= deep['deep_pool_cap']
          assert deep['analyzed_count'] <= deep['selected_for_deep']
          assert deep['score70_count'] <= deep['analyzed_count']
          assert deep['a_grade_count'] <= deep['analyzed_count']
          rows=deep['ranked']
          finite_spreads=sum(1 for r in rows if isinstance(r.get('spread_pct'),(int,float)) and math.isfinite(r['spread_pct']))
          real_pm_vol=sum(1 for r in rows if isinstance(r.get('premarket_volume'),(int,float)) and r['premarket_volume']>0)
          assert finite_spreads >= max(5,len(rows)//2)
          assert real_pm_vol >= max(5,len(rows)//2)
          assert 0 < top['actual_count'] <= 25
          assert final['status'] in {'BUY','NO_TRADE'}

          stages=[e['stage'] for e in timeline['events']]
          required=['PRE-SCREEN','DEEP 100-POINT ANALYSIS','09:18 REFRESH + RANKING','TOP-25 FREEZE','FINAL 09:45 LIVE CONFIRMATION']
          for stage in required:
              assert stage in stages, f'missing stage audit: {stage}'

          print('ENGINE4_REPAIRED_PROVIDER_ACCEPTANCE_PASS')
          print('natural_broad_qualified', pre['broad_qualified'])
          print('nasdaq_premarket_enriched', pre['nasdaq_premarket_enriched'])
          print('nonzero_premarket_activity_count', pre['nonzero_premarket_activity_count'])
          print('finite_spreads', finite_spreads, 'of', len(rows))
          print('final_status', final['status'])
          PY
