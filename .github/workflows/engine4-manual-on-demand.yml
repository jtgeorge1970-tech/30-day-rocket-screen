name: Engine 4 Manual On-Demand

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: true
        default: 'live_today'
        type: choice
        options:
          - live_today
          - acceptance_replay
          - preflight_only
      acceptance_date_et:
        description: 'Historical ET date for acceptance_replay (YYYY-MM-DD)'
        required: false
        default: '2026-09-16'
        type: string
  push:
    branches: [main]
    paths:
      - '.github/engine4-manual-trigger.txt'

concurrency:
  group: engine4-production
  cancel-in-progress: false

jobs:
  manual-on-demand:
    runs-on: ubuntu-latest
    timeout-minutes: 190
    permissions:
      contents: write
      issues: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      OPENPHONE_API_KEY: ${{ secrets.OPENPHONE_API_KEY }}
      OPENPHONE_FROM_NUMBER: ${{ secrets.OPENPHONE_FROM_NUMBER }}
      ENGINE4_SMS_TO: ${{ secrets.ENGINE4_SMS_TO }}
      RUN_MODE: ${{ inputs.mode || 'acceptance_replay' }}
      ACCEPTANCE_DATE_ET: ${{ inputs.acceptance_date_et || '2026-09-16' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Engine 4 dependencies
        run: pip install -r requirements.txt pytest

      - name: Validate requested mode and date
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = 'push' ]; then
            REQUESTED_MODE=$(sed -n 's/^mode=//p' .github/engine4-manual-trigger.txt | head -1)
            REQUESTED_DATE=$(sed -n 's/^acceptance_date_et=//p' .github/engine4-manual-trigger.txt | head -1)
            if [ -n "$REQUESTED_MODE" ]; then RUN_MODE="$REQUESTED_MODE"; fi
            if [ -n "$REQUESTED_DATE" ]; then ACCEPTANCE_DATE_ET="$REQUESTED_DATE"; fi
            printf 'RUN_MODE=%s\nACCEPTANCE_DATE_ET=%s\n' "$RUN_MODE" "$ACCEPTANCE_DATE_ET" >> "$GITHUB_ENV"
          fi
          case "$RUN_MODE" in
            live_today|acceptance_replay|preflight_only) ;;
            *) echo "INVALID MANUAL MODE: $RUN_MODE"; exit 64 ;;
          esac

          if [ "$RUN_MODE" = 'acceptance_replay' ]; then
            python - "$ACCEPTANCE_DATE_ET" <<'PY'
          from datetime import date
          import sys

          value = sys.argv[1]
          try:
              parsed = date.fromisoformat(value)
          except ValueError as exc:
              raise SystemExit(f"INVALID ACCEPTANCE DATE: {value!r}; expected YYYY-MM-DD") from exc
          if parsed.weekday() >= 5:
              raise SystemExit(f"INVALID ACCEPTANCE DATE: {value} is not a weekday")
          print(f"LOCKED ACCEPTANCE MARKET DATE: {value} ET")
          PY
          fi

      - name: Prevent duplicate live daily cycle
        id: duplicate
        if: env.RUN_MODE == 'live_today'
        shell: bash
        run: |
          python - <<'PY'
          import base64, json, os, urllib.parse, urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          repo = os.environ['GITHUB_REPOSITORY']
          current = int(os.environ['GITHUB_RUN_ID'])
          token = os.environ['GITHUB_TOKEN']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          runs = []
          for workflow in ('engine4-production.yml', 'engine4-manual-on-demand.yml'):
              url = f'https://api.github.com/repos/{repo}/actions/workflows/{workflow}/runs?per_page=30'
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=20) as response:
                  runs.extend(json.load(response).get('workflow_runs', []))

          et = ZoneInfo('America/New_York')
          today = datetime.now(et).date()
          existing = []
          for run in runs:
              if int(run.get('id', 0)) == current:
                  continue
              created = datetime.fromisoformat(run['created_at'].replace('Z', '+00:00')).astimezone(et)
              active = run.get('status') in {'queued', 'in_progress', 'waiting', 'pending'}
              successful = run.get('status') == 'completed' and run.get('conclusion') == 'success'
              is_production='engine4-production.yml' in str(run.get('path') or '')
              is_live_manual=False
              if (
                  'engine4-manual-on-demand.yml' in str(run.get('path') or '')
                  and run.get('event') == 'push'
              ):
                  ref=urllib.parse.quote(str(run.get('head_sha') or ''), safe='')
                  content_url=(
                      f'https://api.github.com/repos/{repo}/contents/'
                      f'.github/engine4-manual-trigger.txt?ref={ref}'
                  )
                  try:
                      with urllib.request.urlopen(
                          urllib.request.Request(content_url, headers=headers), timeout=20
                      ) as response:
                          encoded=json.load(response).get('content', '')
                      trigger=base64.b64decode(encoded).decode('utf-8', errors='replace')
                      is_live_manual='mode=live_today' in trigger
                  except Exception as exc:
                      print(f"Could not classify manual run {run.get('id')}: {exc}")
              if (
                  created.date() == today
                  and (active or successful)
                  and (is_production or is_live_manual)
              ):
                  existing.append(run)

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"skip={'true' if existing else 'false'}\n")
          if existing:
              print(f"Manual duplicate safely skipped; existing run={existing[0]['id']} status={existing[0]['status']}")
          else:
              print('No active or successful Engine 4 daily cycle exists; manual live run admitted.')
          PY

      - name: Compile and test Engine 4
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            engine4_config.py engine4_data.py engine4_free_providers.py engine4_score.py \
            engine4_live.py engine4_intraday.py engine4_pipeline.py engine4_pipeline_runner.py \
            engine4_final_guard.py engine4_pipeline_runner_guarded.py engine4_recovery.py engine4_notify.py \
            engine4_bench.py engine4_stage_report.py
          pytest -q test_engine4_*.py
          python engine4_intraday.py self-test
          python engine4_pipeline.py self-test
          python engine4_pipeline_runner.py self-test
          python engine4_recovery.py self-test
          python engine4_bench.py self-test

      - name: Verify providers
        run: python engine4_pipeline_runner_guarded.py provider-smoke

      - name: Complete preflight-only request
        if: env.RUN_MODE == 'preflight_only'
        run: echo 'ENGINE 4 MANUAL PREFLIGHT PASS — code, tests, self-tests, and providers passed.'

      - name: Enforce valid current-day live window
        if: env.RUN_MODE == 'live_today' && steps.duplicate.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          H=$(TZ=America/New_York date +%H)
          M=$(TZ=America/New_York date +%M)
          NOW=$((10#$H * 60 + 10#$M))
          echo "Engine 4 manual live runner requested at ${H}:${M} ET"
          if [ "$NOW" -lt 515 ] || [ "$NOW" -gt 930 ]; then
            echo 'MANUAL LIVE RUN REFUSED — valid current-day on-demand start window is 08:35-15:30 ET.'
            echo 'Outside market hours, use acceptance_replay; production data will not be fabricated or mislabeled.'
            exit 78
          fi

      - name: Send manual live run-started notification
        if: env.RUN_MODE == 'live_today' && steps.duplicate.outputs.skip != 'true'
        run: >-
          python engine4_notify.py start --require-delivery
          --message "ENGINE 4 MANUAL RUN STARTED — current-day live on-demand cycle is active for $(TZ=America/New_York date +%F) ET."

      - name: Lock manual live Eastern market date
        if: env.RUN_MODE == 'live_today' && steps.duplicate.outputs.skip != 'true'
        run: echo "ENGINE_DATE_ET=$(TZ=America/New_York date +%F)" >> "$GITHUB_ENV"

      - name: Manual Stage 1 — broad pre-screen and exact counts
        if: env.RUN_MODE == 'live_today' && steps.duplicate.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          while [ "$(TZ=America/New_York date +%H%M)" -lt 0855 ]; do sleep 15; done
          python engine4_pipeline_runner_guarded.py prescreen --date "$ENGINE_DATE_ET"
          python engine4_stage_report.py prescreen --date "$ENGINE_DATE_ET"
          python engine4_notify.py prescreen --require-delivery \
            --message "$(cat output/engine4/stage_prescreen_sms.txt)"

      - name: Upload manual Stage 1 immediately
        if: env.RUN_MODE == 'live_today' && steps.duplicate.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: engine4-manual-stage1-${{ github.run_id }}
          path: output/engine4/
          if-no-files-found: error

      - name: Manual Stage 2 — deep analysis and exact counts
        if: env.RUN_MODE == 'live_today' && steps.duplicate.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          while [ "$(TZ=America/New_York date +%H%M)" -lt 0905 ]; do sleep 15; done
          python engine4_pipeline_runner_guarded.py deep --date "$ENGINE_DATE_ET"
          python engine4_stage_report.py deep --date "$ENGINE_DATE_ET"
          python engine4_notify.py deep --require-delivery \
            --message "$(cat output/engine4/stage_deep_sms.txt)"

      - name: Upload manual Stage 2 immediately
        if: env.RUN_MODE == 'live_today' && steps.duplicate.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: engine4-manual-stage2-${{ github.run_id }}
          path: output/engine4/
          if-no-files-found: error

      - name: Manual Stage 3 — refresh, rerank, freeze, and exact counts
        if: env.RUN_MODE == 'live_today' && steps.duplicate.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          while [ "$(TZ=America/New_York date +%H%M)" -lt 0918 ]; do sleep 15; done
          python engine4_pipeline_runner_guarded.py refresh --date "$ENGINE_DATE_ET"
          python engine4_stage_report.py freeze --date "$ENGINE_DATE_ET"
          python engine4_notify.py freeze --require-delivery \
            --message "$(cat output/engine4/stage_freeze_sms.txt)"

      - name: Upload manual Stage 3 immediately
        if: env.RUN_MODE == 'live_today' && steps.duplicate.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: engine4-manual-stage3-${{ github.run_id }}
          path: output/engine4/
          if-no-files-found: error

      - name: Manual Stage 3B — rebuild and rank the Top-25 multi-day Bench
        if: env.RUN_MODE == 'live_today' && steps.duplicate.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python engine4_bench.py update --date "$ENGINE_DATE_ET"
          python engine4_stage_report.py bench --date "$ENGINE_DATE_ET"
          python engine4_notify.py bench --require-delivery \
            --message "$(cat output/engine4/stage_bench_sms.txt)"
          git config user.name 'engine4-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add state/engine4/watch_bench.json
          if ! git diff --cached --quiet; then
            git commit -m "Engine 4 ${ENGINE_DATE_ET} Top-25 Bench"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

      - name: Upload manual Stage 3B Bench immediately
        if: env.RUN_MODE == 'live_today' && steps.duplicate.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: engine4-manual-bench-${{ github.run_id }}
          path: |
            output/engine4/watch_bench*
            output/engine4/stage_bench_*
            state/engine4/watch_bench.json
          if-no-files-found: error

      - name: Manual Stage 4 — primary live confirmation
        if: env.RUN_MODE == 'live_today' && steps.duplicate.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          while [ "$(TZ=America/New_York date +%H%M)" -lt 0945 ]; do sleep 15; done
          python engine4_pipeline_runner_guarded.py final --date "$ENGINE_DATE_ET"
          python engine4_stage_report.py final --date "$ENGINE_DATE_ET"
          python engine4_notify.py final --require-delivery

      - name: Upload manual Stage 4 immediately
        if: env.RUN_MODE == 'live_today' && steps.duplicate.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: engine4-manual-stage4-${{ github.run_id }}
          path: output/engine4/
          if-no-files-found: error

      - name: Manual Stage 5 — post-open recovery watch
        if: env.RUN_MODE == 'live_today' && steps.duplicate.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python engine4_recovery.py monitor --date "$ENGINE_DATE_ET" --interval-seconds 300
          python engine4_stage_report.py recovery --date "$ENGINE_DATE_ET"
          python engine4_notify.py recovery --require-delivery

      - name: Verify manual artifacts, order, counts, and both-recipient SMS acceptance
        if: env.RUN_MODE == 'live_today' && steps.duplicate.outputs.skip != 'true'
        run: python engine4_stage_report.py verify-complete --date "$ENGINE_DATE_ET" --recipients 2

      - name: Send true manual terminal completion notification
        if: env.RUN_MODE == 'live_today' && steps.duplicate.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python engine4_notify.py complete --require-delivery \
            --message "ENGINE 4 MANUAL RUN COMPLETE — every required stage finished for ${ENGINE_DATE_ET} ET and all dated artifacts were verified."
          python engine4_stage_report.py verify-notification --date "$ENGINE_DATE_ET" --kind complete --recipients 2
          python engine4_stage_report.py complete --date "$ENGINE_DATE_ET" --recipients 2

      - name: Upload complete manual terminal artifact set
        if: env.RUN_MODE == 'live_today' && steps.duplicate.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: engine4-manual-complete-${{ github.run_id }}
          path: output/engine4/
          if-no-files-found: error
          retention-days: 30

      - name: Run isolated historical acceptance replay
        if: env.RUN_MODE == 'acceptance_replay'
        shell: bash
        run: |
          set -euo pipefail
          echo '=== ACCEPTANCE STAGE 1: BROAD PRE-SCREEN ==='
          python engine4_pipeline_runner_guarded.py prescreen --date "$ACCEPTANCE_DATE_ET"
          echo '=== ACCEPTANCE STAGE 2: DEEP 100-POINT ANALYSIS ==='
          python engine4_pipeline_runner_guarded.py deep --date "$ACCEPTANCE_DATE_ET"
          echo '=== ACCEPTANCE STAGE 3: REFRESH + RANK + FREEZE ==='
          python engine4_pipeline_runner_guarded.py refresh --date "$ACCEPTANCE_DATE_ET"
          echo '=== ACCEPTANCE STAGE 4: FINAL CONFIRMATION REPLAY ==='
          python engine4_pipeline_runner_guarded.py final --date "$ACCEPTANCE_DATE_ET"

      - name: Verify staged acceptance replay
        if: env.RUN_MODE == 'acceptance_replay'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          expected = os.environ['ACCEPTANCE_DATE_ET']
          files = {
              'prescreen': Path('output/engine4/prescreen_report.json'),
              'deep': Path('output/engine4/deep_ranked.json'),
              'freeze': Path('output/engine4/top25_frozen.json'),
              'final': Path('output/engine4/final_signal.json'),
              'timeline': Path('output/engine4/timeline.json'),
          }
          payloads = {name: json.loads(path.read_text(encoding='utf-8')) for name, path in files.items()}
          for name in ('prescreen', 'deep', 'freeze', 'final'):
              assert payloads[name]['target_date_et'] == expected, (name, payloads[name].get('target_date_et'), expected)
          assert payloads['timeline']['market_date_et'] == expected
          stages = [event['stage'] for event in payloads['timeline']['events']]
          required = [
              'PRE-SCREEN',
              'DEEP 100-POINT ANALYSIS',
              '09:18 REFRESH + RANKING',
              'TOP-25 FREEZE',
              'FINAL 09:45 LIVE CONFIRMATION',
          ]
          for stage in required:
              assert stage in stages, f'missing stage audit: {stage}'
          assert payloads['prescreen']['broad_qualified'] > 0
          assert 0 < payloads['prescreen']['retained_by_cap'] <= 100
          assert 0 < payloads['deep']['analyzed_count'] <= 60
          assert 0 <= payloads['freeze']['actual_count'] <= 25
          assert payloads['final']['status'] in {'BUY', 'NO_TRADE'}
          print('ENGINE4_MANUAL_ACCEPTANCE_PASS')
          print('acceptance_date_et', expected)
          print('final_status', payloads['final']['status'])
          print('final_reason', payloads['final'].get('reason'))
          PY

      - name: Stage isolated manual artifacts
        if: env.RUN_MODE != 'preflight_only' && always()
        shell: bash
        run: |
          mkdir -p "manual-artifacts/${GITHUB_RUN_ID}"
          if [ -d output/engine4 ]; then
            cp -a output/engine4/. "manual-artifacts/${GITHUB_RUN_ID}/"
          fi
          printf '%s\n' \
            "run_id=${GITHUB_RUN_ID}" \
            "mode=${RUN_MODE}" \
            "requested_acceptance_date_et=${ACCEPTANCE_DATE_ET}" \
            "completed_utc=$(date -u +%FT%TZ)" \
            > "manual-artifacts/${GITHUB_RUN_ID}/manual_run_metadata.txt"

      - name: Upload isolated manual artifacts
        if: env.RUN_MODE != 'preflight_only' && always()
        uses: actions/upload-artifact@v4
        with:
          name: engine4-manual-${{ env.RUN_MODE }}-${{ github.run_id }}
          path: manual-artifacts/${{ github.run_id }}/
          if-no-files-found: error
          retention-days: 30

      - name: Send manual live pipeline-failure alert
        if: failure() && env.RUN_MODE == 'live_today' && steps.duplicate.outputs.skip != 'true'
        run: >-
          python engine4_notify.py failure --require-delivery
          --message "ENGINE 4 MANUAL RUN FAILURE — the live on-demand workflow did not complete. Review the failed stage; no completed result is being reported."
