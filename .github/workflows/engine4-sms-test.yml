name: Engine 4 SMS Test

on:
  workflow_dispatch:

jobs:
  sms-test:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      OPENPHONE_API_KEY: ${{ secrets.OPENPHONE_API_KEY }}
      OPENPHONE_FROM_NUMBER: ${{ secrets.OPENPHONE_FROM_NUMBER }}
      ENGINE4_SMS_TO: ${{ secrets.ENGINE4_SMS_TO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Send real Engine 4 test text
        run: >-
          python engine4_notify.py test
          --message "Engine 4 OpenPhone SMS connection is working."
