name: Engine 4 Intraday Production

on:
  workflow_dispatch:
  schedule:
    - cron: '5,10,15,20 12 * * 1-5'
    - cron: '5,10,15,20 13 * * 1-5'

# A fresh production/manual start may supersede obsolete tail work. Completed
# artifacts remain in GitHub; stale execution must not hold the lane.
concurrency:
  group: engine4-production
  cancel-in-progress: true

jobs:
  engine4:
    runs-on: ubuntu-latest
    timeout-minutes: 190
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Compile and test Engine 4
        run: |
          python -m py_compile engine4_config.py engine4_data.py engine4_free_providers.py engine4_score.py engine4_live.py engine4_intraday.py engine4_pipeline.py engine4_pipeline_runner.py engine4_final_guard.py engine4_pipeline_runner_guarded.py engine4_recovery.py engine4_notify.py engine4_bench.py engine4_stage_report.py
          pytest -q test_engine4_*.py
      - name: Verify providers
        run: python engine4_pipeline_runner_guarded.py provider-smoke
      - name: Verify correct ET wake
        id: window
        shell: bash
        run: |
          H=$(TZ=America/New_York date +%H); M=$(TZ=America/New_York date +%M); T=$((10#$H * 60 + 10#$M))
          echo "Engine 4 production runner woke at ${H}:${M} ET"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then echo 'skip=false' >> "$GITHUB_OUTPUT"; elif [ "$T" -lt 485 ] || [ "$T" -gt 515 ]; then echo 'skip=true' >> "$GITHUB_OUTPUT"; else echo 'skip=false' >> "$GITHUB_OUTPUT"; fi
      - name: Lock Eastern market date
        if: steps.window.outputs.skip != 'true'
        run: echo "ENGINE_DATE_ET=$(TZ=America/New_York date +%F)" >> "$GITHUB_ENV"
      - name: START notification
        if: steps.window.outputs.skip != 'true'
        run: python engine4_notify.py start --message "ENGINE 4 STARTED — the scheduled run is active for $(TZ=America/New_York date +%F) ET."
      - name: Stage 1 — broad pre-screen and exact counts
        if: steps.window.outputs.skip != 'true'
        run: |
          while [ "$(TZ=America/New_York date +%H%M)" -lt 0825 ]; do sleep 15; done
          python engine4_pipeline_runner_guarded.py prescreen --date "$ENGINE_DATE_ET"
          python engine4_stage_report.py prescreen --date "$ENGINE_DATE_ET"
          python engine4_notify.py prescreen --message "$(cat output/engine4/stage_prescreen_sms.txt)"
      - name: Upload Stage 1 immediately
        if: steps.window.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with: {name: 'engine4-stage1-${{ github.run_id }}', path: 'output/engine4/', if-no-files-found: error}
      - name: Stage 2 — deep analysis and exact counts
        if: steps.window.outputs.skip != 'true'
        run: |
          while [ "$(TZ=America/New_York date +%H%M)" -lt 0835 ]; do sleep 15; done
          python engine4_pipeline_runner_guarded.py deep --date "$ENGINE_DATE_ET"
          python engine4_stage_report.py deep --date "$ENGINE_DATE_ET"
          python engine4_notify.py deep --message "$(cat output/engine4/stage_deep_sms.txt)"
      - name: Upload Stage 2 immediately
        if: steps.window.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with: {name: 'engine4-stage2-${{ github.run_id }}', path: 'output/engine4/', if-no-files-found: error}
      - name: Stage 3 — refresh, rerank, freeze, and exact counts
        if: steps.window.outputs.skip != 'true'
        run: |
          while [ "$(TZ=America/New_York date +%H%M)" -lt 0848 ]; do sleep 15; done
          python engine4_pipeline_runner_guarded.py refresh --date "$ENGINE_DATE_ET"
          python engine4_stage_report.py freeze --date "$ENGINE_DATE_ET"
          python engine4_notify.py freeze --message "$(cat output/engine4/stage_freeze_sms.txt)"
      - name: Upload Stage 3 immediately
        if: steps.window.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with: {name: 'engine4-stage3-${{ github.run_id }}', path: 'output/engine4/', if-no-files-found: error}
      - name: Stage 3B — rebuild and rank Top-25 Bench
        if: steps.window.outputs.skip != 'true'
        run: |
          python engine4_bench.py update --date "$ENGINE_DATE_ET"
          python engine4_stage_report.py bench --date "$ENGINE_DATE_ET"
          python engine4_notify.py bench --message "$(cat output/engine4/stage_bench_sms.txt)"
      - name: Upload Stage 3B Bench immediately
        if: steps.window.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: engine4-bench-${{ github.run_id }}
          path: |
            output/engine4/watch_bench*
            output/engine4/stage_bench_*
            output/engine4/notification_bench*
            state/engine4/watch_bench.json
          if-no-files-found: error
      - name: Stage 4 — primary live confirmation
        if: steps.window.outputs.skip != 'true'
        run: |
          while [ "$(TZ=America/New_York date +%H%M)" -lt 0945 ]; do sleep 15; done
          python engine4_pipeline_runner_guarded.py final --date "$ENGINE_DATE_ET"
          python engine4_stage_report.py final --date "$ENGINE_DATE_ET"
          python engine4_notify.py final
      - name: Upload Stage 4 immediately
        if: steps.window.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with: {name: 'engine4-stage4-${{ github.run_id }}', path: 'output/engine4/', if-no-files-found: error}
      - name: Stage 5 — post-open recovery watch
        if: steps.window.outputs.skip != 'true'
        run: |
          python engine4_recovery.py monitor --date "$ENGINE_DATE_ET" --interval-seconds 300
          python engine4_stage_report.py recovery --date "$ENGINE_DATE_ET"
          python engine4_notify.py recovery
      - name: Verify artifacts, order and counts
        if: steps.window.outputs.skip != 'true'
        run: python engine4_stage_report.py verify-complete --date "$ENGINE_DATE_ET" --recipients 0
      - name: COMPLETE notification
        if: steps.window.outputs.skip != 'true'
        run: |
          python engine4_notify.py complete --message "ENGINE 4 COMPLETE — all required stages finished for ${ENGINE_DATE_ET} ET and the dated artifacts were verified."
          python engine4_stage_report.py complete --date "$ENGINE_DATE_ET" --recipients 0
      - name: Upload complete terminal artifact set
        if: steps.window.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with: {name: 'engine4-complete-${{ github.run_id }}', path: 'output/engine4/', if-no-files-found: error, retention-days: 30}
      - name: FAILURE notification
        if: failure() && steps.window.outputs.skip != 'true'
        run: python engine4_notify.py failure --message "ENGINE 4 DATA/PIPELINE FAILURE — the scheduled workflow did not complete. Review the failed stage; no completed result is being reported."
