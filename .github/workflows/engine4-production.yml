name: Engine 4 Intraday Production

on:
  workflow_dispatch:
  schedule:
    - cron: '35 8 * * 1-5'
      timezone: 'America/New_York'

concurrency:
  group: engine4-production
  cancel-in-progress: false

jobs:
  engine4:
    runs-on: ubuntu-latest
    timeout-minutes: 190
    permissions:
      contents: write
      issues: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      OPENPHONE_API_KEY: ${{ secrets.OPENPHONE_API_KEY }}
      OPENPHONE_FROM_NUMBER: ${{ secrets.OPENPHONE_FROM_NUMBER }}
      ENGINE4_SMS_TO: ${{ secrets.ENGINE4_SMS_TO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Detect duplicate daily production cycle
        id: duplicate
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          repo=os.environ['GITHUB_REPOSITORY']
          current=int(os.environ['GITHUB_RUN_ID'])
          token=os.environ['GITHUB_TOKEN']
          url=f"https://api.github.com/repos/{repo}/actions/workflows/engine4-production.yml/runs?per_page=30"
          request=urllib.request.Request(
              url,
              headers={
                  "Accept":"application/vnd.github+json",
                  "Authorization":f"Bearer {token}",
                  "X-GitHub-Api-Version":"2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              runs=json.load(response).get('workflow_runs', [])

          et=ZoneInfo('America/New_York')
          today=datetime.now(et).date()
          earlier=[]
          for run in runs:
              if int(run.get('id', 0)) == current:
                  continue
              created=datetime.fromisoformat(run['created_at'].replace('Z','+00:00')).astimezone(et).date()
              active=run.get('status') in {'queued','in_progress','waiting','pending'}
              successful=run.get('status') == 'completed' and run.get('conclusion') == 'success'
              if created == today and (active or successful):
                  earlier.append(run)

          output=os.environ['GITHUB_OUTPUT']
          with open(output, 'a', encoding='utf-8') as handle:
              handle.write(f"skip={'true' if earlier else 'false'}\n")
          if earlier:
              print(f"Duplicate daily cycle safely skipped; existing run={earlier[0]['id']} status={earlier[0]['status']}")
          else:
              print("No earlier active or successful Engine 4 production cycle exists today.")
          PY

      - name: Verify correct ET wake
        if: steps.duplicate.outputs.skip != 'true'
        shell: bash
        run: |
          H=$(TZ=America/New_York date +%H)
          M=$(TZ=America/New_York date +%M)
          T=$((10#$H * 60 + 10#$M))
          echo "Engine 4 production runner woke at ${H}:${M} ET"
          if [ "$T" -lt 515 ] || [ "$T" -gt 545 ]; then
            echo 'ENGINE 4 DATA/PIPELINE FAILURE — production runner woke outside the usable 08:35-09:05 ET window.'
            exit 78
          fi

      - name: Send run-started notification
        if: steps.duplicate.outputs.skip != 'true'
        run: >-
          python engine4_notify.py start --require-delivery
          --message "ENGINE 4 STARTED — the scheduled run is active for $(TZ=America/New_York date +%F) ET."

      - name: Run ordered Engine 4 cycle
        if: steps.duplicate.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          ENGINE_DATE_ET=$(TZ=America/New_York date +%F)
          export ENGINE_DATE_ET
          echo "Locked Engine 4 market date: ${ENGINE_DATE_ET} ET"

          verify_date() {
            FILE="$1"
            python - "$FILE" "$ENGINE_DATE_ET" <<'PY'
          import json, sys
          from pathlib import Path
          path=Path(sys.argv[1])
          expected=sys.argv[2]
          payload=json.loads(path.read_text(encoding='utf-8'))
          actual=str(payload.get('target_date_et') or payload.get('market_date_et') or '')
          if actual != expected:
              raise SystemExit(f"ENGINE 4 DATE FAILURE — {path} has {actual!r}; expected {expected!r}")
          print(f"DATE VERIFIED: {path} = {expected} ET")
          PY
          }

          reject_pipeline_failure() {
            FILE="$1"
            python - "$FILE" <<'PY'
          import json, sys
          from pathlib import Path
          path=Path(sys.argv[1])
          payload=json.loads(path.read_text(encoding='utf-8'))
          if payload.get('status') == 'PIPELINE_FAILURE':
              raise SystemExit(f"ENGINE 4 PIPELINE FAILURE — {path}: {payload.get('reason')}")
          print(f"TERMINAL STATUS VERIFIED: {path} = {payload.get('status')}")
          PY
          }

          wait_until_et() {
            TARGET="$1"
            while true; do
              H=$(TZ=America/New_York date +%H)
              M=$(TZ=America/New_York date +%M)
              NOW=$((10#$H * 60 + 10#$M))
              if [ "$NOW" -ge "$TARGET" ]; then
                break
              fi
              sleep 15
            done
          }

          fail_if_late() {
            DEADLINE="$1"
            LABEL="$2"
            H=$(TZ=America/New_York date +%H)
            M=$(TZ=America/New_York date +%M)
            NOW=$((10#$H * 60 + 10#$M))
            if [ "$NOW" -gt "$DEADLINE" ]; then
              echo "ENGINE 4 DATA/PIPELINE FAILURE — ${LABEL} missed its production deadline."
              exit 79
            fi
          }

          save_stage() {
            LABEL="$1"
            git config user.name 'engine4-bot'
            git config user.email 'actions@users.noreply.github.com'
            git add output/engine4/ || true
            if git diff --cached --quiet; then
              echo "No Engine 4 output changes for ${LABEL}."
              return
            fi
            git commit -m "Engine 4 ${LABEL}"
            git pull --rebase origin main
            git push origin HEAD:main
          }

          echo '=== STAGE 1: 08:55 ET BROAD PRE-SCREEN ==='
          wait_until_et 535
          fail_if_late 540 '08:55 pre-screen start'
          python engine4_pipeline_runner_guarded.py prescreen --date "$ENGINE_DATE_ET"
          verify_date output/engine4/prescreen_report.json
          verify_date output/engine4/timeline.json
          save_stage '08:55 pre-screen complete'

          echo '=== STAGE 2: 09:05 ET DEEP 100-POINT ANALYSIS ==='
          wait_until_et 545
          fail_if_late 550 '09:05 deep-analysis start'
          python engine4_pipeline_runner_guarded.py deep --date "$ENGINE_DATE_ET"
          verify_date output/engine4/deep_ranked.json
          save_stage '09:05 deep analysis complete'

          echo '=== STAGE 3: 09:18 ET REFRESH + RANK + FREEZE ==='
          wait_until_et 558
          fail_if_late 565 '09:18 refresh/freeze start'
          python engine4_pipeline_runner_guarded.py refresh --date "$ENGINE_DATE_ET"
          verify_date output/engine4/top25_frozen.json
          save_stage '09:18 refresh and Top-25 freeze'

          echo '=== STAGE 4: 09:45 ET FINAL LIVE CONFIRMATION ==='
          wait_until_et 585
          fail_if_late 588 '09:45 final live confirmation start'
          python engine4_pipeline_runner_guarded.py final --date "$ENGINE_DATE_ET"
          verify_date output/engine4/final_signal.json
          reject_pipeline_failure output/engine4/final_signal.json
          python engine4_notify.py final --require-delivery
          save_stage '09:45 final live result'

          echo '=== STAGE 5: POST-OPEN HOOK-SET / RECOVERY WATCH ==='
          # Only the small recovery-watch list is polled. If a valid base forms,
          # the module exits immediately with a BUY or a broker-side stop-limit
          # instruction. Otherwise it closes the watch at 11:30 ET.
          python engine4_recovery.py monitor --date "$ENGINE_DATE_ET" --interval-seconds 300
          verify_date output/engine4/recovery_signal.json
          reject_pipeline_failure output/engine4/recovery_signal.json
          python engine4_notify.py recovery --require-delivery
          save_stage 'post-open recovery result'

          python engine4_notify.py complete --require-delivery \
            --message "ENGINE 4 COMPLETE — all required stages finished for ${ENGINE_DATE_ET} ET and the dated artifacts were verified."

          echo '=== ENGINE 4 ORDERED CYCLE COMPLETE ==='
          cat output/engine4/timeline.txt
          echo '--- PRIMARY FINAL ALERT ---'
          cat output/engine4/final_alert.txt
          echo '--- RECOVERY ALERT ---'
          cat output/engine4/recovery_alert.txt

      - name: Send immediate pipeline-failure alert
        if: failure() && steps.duplicate.outputs.skip != 'true'
        run: >-
          python engine4_notify.py failure
          --require-delivery
          --message "ENGINE 4 DATA/PIPELINE FAILURE — the scheduled workflow did not complete. Review the linked run for the failed stage; no completed result is being reported."
