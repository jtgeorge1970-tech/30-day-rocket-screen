name: Engine 4 Intraday Production

on:
  workflow_dispatch:
  schedule:
    - cron: '35 12 * * 1-5'
    - cron: '35 13 * * 1-5'

concurrency:
  group: engine4-production
  cancel-in-progress: false

jobs:
  engine4:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Verify correct ET wake
        shell: bash
        run: |
          H=$(TZ=America/New_York date +%H)
          M=$(TZ=America/New_York date +%M)
          T=$((10#$H * 60 + 10#$M))
          echo "Engine 4 production runner woke at ${H}:${M} ET"
          if [ "$T" -lt 500 ] || [ "$T" -gt 550 ]; then
            echo 'Wrong seasonal duplicate or unusably late wake — exiting without running Engine 4.'
            exit 78
          fi

      - name: Run ordered Engine 4 cycle
        shell: bash
        run: |
          set -euo pipefail

          wait_until_et() {
            TARGET="$1"
            while true; do
              H=$(TZ=America/New_York date +%H)
              M=$(TZ=America/New_York date +%M)
              NOW=$((10#$H * 60 + 10#$M))
              if [ "$NOW" -ge "$TARGET" ]; then
                break
              fi
              sleep 15
            done
          }

          save_stage() {
            LABEL="$1"
            git config user.name 'engine4-bot'
            git config user.email 'actions@users.noreply.github.com'
            git add output/engine4/ || true
            if git diff --cached --quiet; then
              echo "No Engine 4 output changes for ${LABEL}."
              return
            fi
            git commit -m "Engine 4 ${LABEL}"
            git pull --rebase origin main
            git push origin HEAD:main
          }

          echo '=== STAGE 1: 08:55 ET BROAD PRE-SCREEN ==='
          wait_until_et 535
          python engine4_pipeline_runner.py prescreen
          save_stage '08:55 pre-screen complete'

          echo '=== STAGE 2: 09:05 ET DEEP 100-POINT ANALYSIS ==='
          wait_until_et 545
          python engine4_pipeline_runner.py deep
          save_stage '09:05 deep analysis complete'

          echo '=== STAGE 3: 09:18 ET REFRESH + RANK + FREEZE ==='
          wait_until_et 558
          python engine4_pipeline_runner.py refresh
          save_stage '09:18 refresh and Top-25 freeze'

          echo '=== STAGE 4: 09:45 ET FINAL LIVE CONFIRMATION ==='
          wait_until_et 585
          python engine4_pipeline_runner.py final
          save_stage '09:45 final live result'

          echo '=== ENGINE 4 ORDERED CYCLE COMPLETE ==='
          cat output/engine4/timeline.txt
          echo '--- FINAL ALERT ---'
          cat output/engine4/final_alert.txt
