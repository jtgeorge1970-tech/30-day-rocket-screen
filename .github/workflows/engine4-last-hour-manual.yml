name: Engine 4 Last-Hour Manual Snapshot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/engine4-last-hour-trigger.txt']

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 260
    env:
      GH_TOKEN: ${{ github.token }}
      HEARTBEAT_ISSUE: "37"
      NTFY_TOPIC: "notifyme"
    permissions:
      contents: read
      actions: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Flush prior last-hour outputs and artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf output/engine4_last_hour
          mkdir -p output/engine4_last_hour
          python - <<'PY'
          import json, os, urllib.request
          repo=os.environ["GITHUB_REPOSITORY"]
          current=int(os.environ["GITHUB_RUN_ID"])
          token=os.environ["GH_TOKEN"]
          headers={"Authorization":"Bearer "+token,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
          def api(url, method="GET"):
              req=urllib.request.Request(url,method=method,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:
                  data=r.read()
                  return json.loads(data) if data else None
          runs=api(f"https://api.github.com/repos/{repo}/actions/workflows/engine4-last-hour-manual.yml/runs?per_page=50")["workflow_runs"]
          cancelled=[]
          for run in runs:
              rid=int(run["id"])
              if rid==current: continue
              if run.get("status") in ("queued","in_progress","pending","waiting","requested"):
                  try:
                      api(f"https://api.github.com/repos/{repo}/actions/runs/{rid}/cancel","POST")
                      cancelled.append(rid)
                  except Exception as e:
                      print(f"cancel_failed run={rid} error={e}")
          deleted=[]
          for run in runs:
              rid=int(run["id"])
              if rid==current: continue
              arts=api(f"https://api.github.com/repos/{repo}/actions/runs/{rid}/artifacts?per_page=100")["artifacts"]
              for art in arts:
                  api(f"https://api.github.com/repos/{repo}/actions/artifacts/{art['id']}", "DELETE")
                  deleted.append({"run_id":rid,"artifact_id":art["id"],"name":art["name"]})
          with open("output/engine4_last_hour/fresh_reset_manifest.json","w") as f:
              json.dump({"current_run_id":current,"older_runs_cancelled":cancelled,"old_artifacts_deleted":deleted,"old_output_flushed":True,"prior_bench_state_ignored":True},f,indent=2)
          print(json.dumps({"older_runs_cancelled":cancelled,"old_artifacts_deleted_count":len(deleted),"old_output_flushed":True,"prior_bench_state_ignored":True}))
          PY
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt pytest
      - name: Compile and provider proof
        run: |
          python -m py_compile engine4_last_hour_runner.py engine4_score.py engine4_data.py engine4_pipeline_runner.py
          python engine4_pipeline_runner_guarded.py provider-smoke
      - name: Install 5-minute heartbeat helper
        run: |
          cat > /tmp/run_with_engine4_heartbeat.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          label="$1"; shift
          log="output/engine4_last_hour/heartbeat.log"
          mkdir -p "$(dirname "$log")"
          post_heartbeat() {
            local msg="$1"
            local payload
            payload=$(python -c 'import json,sys; print(json.dumps({"body":sys.argv[1]}))' "$msg")
            curl --fail --silent --show-error -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$HEARTBEAT_ISSUE/comments" \
              -d "$payload" >/dev/null
            curl --fail --silent --show-error -X POST \
              -H "Title: Engine 4 heartbeat" \
              -H "Priority: high" \
              -H "Tags: rocket" \
              -d "$msg" \
              "https://ntfy.sh/$NTFY_TOPIC" >/dev/null
          }
          "$@" &
          pid=$!
          next=0
          while kill -0 "$pid" 2>/dev/null; do
            now_epoch=$(date +%s)
            if [ "$now_epoch" -ge "$next" ]; then
              stamp=$(TZ=America/New_York date '+%Y-%m-%d %I:%M:%S %p ET')
              line="ENGINE4 HEARTBEAT — run ${GITHUB_RUN_ID} — ${label} RUNNING — ${stamp}"
              echo "$line" | tee -a "$log"
              post_heartbeat "$line"
              next=$((now_epoch + 300))
            fi
            sleep 5
          done
          wait "$pid"
          rc=$?
          stamp=$(TZ=America/New_York date '+%Y-%m-%d %I:%M:%S %p ET')
          if [ "$rc" -eq 0 ]; then
            line="ENGINE4 HEARTBEAT — run ${GITHUB_RUN_ID} — ${label} COMPLETE — ${stamp}"
          else
            line="ENGINE4 HEARTBEAT — run ${GITHUB_RUN_ID} — ${label} FAILED rc=${rc} — ${stamp}"
          fi
          echo "$line" | tee -a "$log"
          post_heartbeat "$line"
          exit "$rc"
          SH
          chmod +x /tmp/run_with_engine4_heartbeat.sh
      - name: Stage 1 14:30-15:30 ET broad screen
        run: /tmp/run_with_engine4_heartbeat.sh STAGE1 python engine4_last_hour_runner.py stage1 --date 2026-10-02
      - uses: actions/upload-artifact@v4
        with: {name: 'engine4-last-hour-stage1-${{ github.run_id }}', path: 'output/engine4_last_hour/', if-no-files-found: error}
      - name: Stage 2 deep analysis
        run: /tmp/run_with_engine4_heartbeat.sh STAGE2 python engine4_last_hour_runner.py stage2 --date 2026-10-02
      - uses: actions/upload-artifact@v4
        with: {name: 'engine4-last-hour-stage2-${{ github.run_id }}', path: 'output/engine4_last_hour/', if-no-files-found: error}
      - name: Stage 3 refresh and freeze
        run: /tmp/run_with_engine4_heartbeat.sh STAGE3 python engine4_last_hour_runner.py stage3 --date 2026-10-02
      - uses: actions/upload-artifact@v4
        with: {name: 'engine4-last-hour-stage3-${{ github.run_id }}', path: 'output/engine4_last_hour/', if-no-files-found: error}
      - name: Stage 3B Bench
        run: /tmp/run_with_engine4_heartbeat.sh STAGE3B python engine4_last_hour_runner.py bench --date 2026-10-02
      - uses: actions/upload-artifact@v4
        with: {name: 'engine4-last-hour-bench-${{ github.run_id }}', path: 'output/engine4_last_hour/', if-no-files-found: error}
      - name: Stage 4 15:30 snapshot evaluation
        run: /tmp/run_with_engine4_heartbeat.sh STAGE4 python engine4_last_hour_runner.py stage4 --date 2026-10-02
      - name: Stage 5 recovery disposition
        run: /tmp/run_with_engine4_heartbeat.sh STAGE5 python engine4_last_hour_runner.py stage5 --date 2026-10-02
      - name: Verify complete
        run: /tmp/run_with_engine4_heartbeat.sh VERIFY python engine4_last_hour_runner.py verify --date 2026-10-02
      - uses: actions/upload-artifact@v4
        with: {name: 'engine4-last-hour-complete-${{ github.run_id }}', path: 'output/engine4_last_hour/', if-no-files-found: error, retention-days: 30}
