name: Engine 4 VERA Recovery Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/engine4-vera-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Replay VERA 2026-09-15 recovery scans
        shell: bash
        run: |
          set -euo pipefail
          TODAY_ET=$(TZ=America/New_York date +%F)
          if [ "$TODAY_ET" != "2026-09-15" ]; then
            echo 'Probe date has passed; no action.'
            exit 0
          fi
          python - <<'PY'
          from datetime import date
          import math
          import pandas as pd
          import engine4_recovery as r
          from engine4_data import download_intraday
          from engine4_config import ET

          d=date(2026,9,15)
          frames=download_intraday(['VERA'], period='1d', interval='1m', prepost=False, date_et=d, lookback_days=0)
          frame=frames['VERA']
          same=frame[frame.index.date==d]
          if same.empty:
              raise SystemExit('VERA frame missing')

          armed=[]
          print('--- 5-MINUTE RECOVERY REPLAY ---')
          for ts in pd.date_range('2026-09-15 09:50','2026-09-15 11:30',freq='5min',tz='America/New_York'):
              cut=same[same.index<=ts]
              if cut.empty:
                  continue
              px=float(pd.to_numeric(cut['Close'],errors='coerce').dropna().iloc[-1])
              old_mid=r._current_mid
              r._current_mid=lambda symbol, px=px: (px, px-0.01, px+0.01, 0.06)
              try:
                  m=r.recovery_metrics('VERA', cut, d)
              finally:
                  r._current_mid=old_mid
              print(ts.strftime('%H:%M'), 'px', round(px,3), 'state', m.get('state'), 'trigger', round(m.get('entry_trigger'),3) if isinstance(m.get('entry_trigger'),(int,float)) and math.isfinite(m.get('entry_trigger')) else None, 'fail', m.get('failures'))
              if m.get('state') in {'ARM','BUY'}:
                  armed.append((ts,m))
          print('ARM_OR_BUY_COUNT', len(armed))
          if armed:
              ts,m=armed[0]
              print('EARLIEST_ACTIONABLE_TIME_ET', ts.isoformat())
              print('EARLIEST_STATE', m['state'])
              print('EARLIEST_PRICE', m['current_price'])
              print('ENTRY_TRIGGER', m['entry_trigger'])
              print('MAX_BUY', m['max_allowed_buy_price'])
              print('INITIAL_STOP', m['initial_stop'])
              print('FIRST_TARGET', m['first_target'])
              print('PROFIT_STOP', m['precalculated_profit_stop'])
          else:
              print('NO_ACTIONABLE_RECOVERY_SIGNAL')
          PY
