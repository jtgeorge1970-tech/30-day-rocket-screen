name: Engine 4 Universe Audit
on:
  push:
    branches: [main]
    paths:
      - 'universe_audit.py'
      - '.github/workflows/engine4-universe-audit.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fresh full-universe audit
        run: python universe_audit.py
      - name: Show audit
        run: cat output/engine4_universe_audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: engine4-universe-audit-${{ github.run_id }}
          path: |
            output/engine4_universe_audit.json
            output/engine4_universe_eligible.csv
