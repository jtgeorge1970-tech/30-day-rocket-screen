# Full fresh rerun — manual/maintenance workflow only.
# IMPORTANT: This workflow must NOT run on a market-day schedule. Engine 4 production
# owns the ordered intraday cycle in engine4-production.yml.
name: Full 30-Day Rocket Screen
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rocket_screen.py'
      - '.github/workflows/run-screen.yml'
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Force fresh fundamentals for full run
        run: rm -f output/fundamentals_checkpoint.csv
      - name: Run complete market-wide three-lens screen
        run: python rocket_screen.py
      - name: Save auditable results
        run: |
          git config user.name 'rocket-screen-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add output/
          git diff --cached --quiet || git commit -m 'Full Rocket Screen results'
          git push
