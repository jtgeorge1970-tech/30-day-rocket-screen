name: OFTS v2.3 Research Validation
on:
  workflow_dispatch:
  push:
    paths:
      - 'ofts/research/**'
      - '.github/workflows/ofts-v23-validation.yml'
jobs:
  controls:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install historical data provider
        run: python -m pip install yfinance
      - name: Acquire multi-year market history
        run: python -m ofts.research.acquire_extended_history
      - name: Python compile and 13-control regression
        run: |
          python -m compileall -q ofts/research
          python -m ofts.research.run_v23_controls
          python -m ofts.research.run_v23_holdout
      - name: Walk-forward and negative controls
        run: python -m ofts.research.run_v23_walkforward
      - name: Rebuild Step 4 fingerprint events
        run: python -m ofts.research.run_step4_fingerprints
      - name: Build extended historical fingerprints
        run: python -m ofts.research.build_extended_fingerprints
      - name: Build Step 5 BUY/SELL research fingerprints
        run: python -m ofts.research.run_step5_fingerprints
      - name: Audit Step 6 and 7 outcomes
        run: python -m ofts.research.run_step6_7_outcomes
      - name: Commit validated research outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ofts/validation/extended_fingerprint_events.csv ofts/validation/extended_fingerprint_acceptance.txt ofts/research/extended_history_ohlcv.csv ofts/validation/history_acquisition.txt ofts/validation/v23_candidate_results.csv ofts/validation/v23_walkforward_results.csv ofts/validation/step3_final_acceptance.txt ofts/validation/step4_fingerprint_events.csv ofts/validation/step4_acceptance.txt ofts/validation/step5_fingerprint_scores.csv ofts/validation/step5_acceptance.txt ofts/validation/step6_7_outcomes.csv ofts/validation/step6_7_acceptance.txt
          if ! git diff --cached --quiet; then
            git commit -m "OFTS v2.3 verified Python research results [skip ci]"
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ofts-v23-research-results
          path: |
            ofts/validation/extended_fingerprint_events.csv
            ofts/validation/extended_fingerprint_acceptance.txt
            ofts/research/extended_history_ohlcv.csv
            ofts/validation/history_acquisition.txt
            ofts/validation/v23_candidate_results.csv
            ofts/validation/v23_walkforward_results.csv
            ofts/validation/step3_final_acceptance.txt
            ofts/validation/step4_fingerprint_events.csv
            ofts/validation/step4_acceptance.txt
            ofts/validation/step5_fingerprint_scores.csv
            ofts/validation/step5_acceptance.txt
            ofts/validation/step6_7_outcomes.csv
            ofts/validation/step6_7_acceptance.txt
