name: OFTS full-universe identity-aware rescore
on:
  workflow_dispatch:
  push:
    paths:
      - 'ofts/worker.py'
      - 'ofts/research/security_regimes.py'
      - 'ofts/research/swing_health.py'
      - 'ofts/test_swing_health.py'
      - 'ofts/research/recent_viability.py'
      - 'ofts/test_recent_viability.py'
      - 'ofts/research/opportunity_v06.py'
      - 'ofts/test_opportunity_v06.py'
      - '.github/workflows/ofts-full-universe-identity-rescore.yml'
permissions:
  contents: read
jobs:
  identity-rescore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify swing-health unit regressions
        run: python -m unittest ofts.test_swing_health ofts.test_recent_viability ofts.test_opportunity_v06 -v
      - name: Restore original full-universe market-data cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ofts-output/universe_ohlcv.csv
            ofts-output/download_completed.txt
          key: ofts-history-identity-audit
          restore-keys: |
            ofts-history-
      - name: Require original historical data, never fabricate
        run: |
          test -s ofts-output/universe_ohlcv.csv
          test -s ofts-output/download_completed.txt
      - name: Rescore full 5502 universe using verified identity boundaries
        run: python -m ofts.worker
      - name: Verify invalid historical IQMX leader was excluded
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root = Path('ofts-output')
          rows = list(csv.DictReader((root/'v23_research_universe.csv').open()))
          ranked = list(csv.DictReader((root/'v23_research_ranked.csv').open()))
          assert len(rows) == 5502, len(rows)
          iqmx = next(r for r in rows if r['symbol'] == 'IQMX')
          assert int(iqmx['raw_bars']) > int(iqmx['bars']), iqmx
          assert iqmx['regime_start'] == '2026-07-02', iqmx
          assert iqmx['status'] == 'INSUFFICIENT_POST_REGIME_HISTORY', iqmx
          assert iqmx['score'] == '', iqmx
          assert all(r['symbol'] != 'IQMX' for r in ranked), 'INVALID_IQMX_LEADER_RETAINED'
          assert all(r['swing_state'] and r['swing_entry'] and r['swing_reason'] for r in ranked), 'MISSING_SWING_HEALTH_DIAGNOSTIC'
          assert all(r['viability_state'] and r['viability_entry'] and r['viability_reason'] for r in ranked), 'MISSING_RECENT_VIABILITY_DIAGNOSTIC'
          shortlist=list(csv.DictReader((root/'v23_research_recent_viability_shortlist.csv').open()))
          assert all(r['combined_research_entry']=='REVIEW' and r['status']=='CANDIDATE' for r in shortlist), 'INVALID_REVIEW_SHORTLIST'
          v06=list(csv.DictReader((root/'v06_opportunity_research_ranked.csv').open()))
          assert len(v06)==len(shortlist), 'V06_MUST_RANK_ALL_REVIEW_NAMES'
          assert all(r['opportunity_v06_status']=='PARTIAL_RESEARCH_ONLY' for r in v06), 'V06_INCORRECT_STATUS'
          assert all(r['opportunity_v06_eligibility']=='PENDING_ELIGIBILITY' for r in v06), 'UNVERIFIED_ELIGIBILITY_WAS_PASSED'
          assert all(float(a['opportunity_v06_score']) >= float(b['opportunity_v06_score']) for a,b in zip(v06,v06[1:])), 'V06_WRONG_ORDER'
          assert v06[0]['symbol']=='CTOS', 'V06_EXPECTED_CONTROL_CTOS'
          report = {
            'universe': len(rows),
            'scores': len(ranked),
            'identity_boundary_iqmx': iqmx,
            'top25': ranked[:25],
            'swing_health_experimental': True,
            'recent_viability_experimental': True,
            'experimental_review_shortlist_count': len(shortlist),
            'experimental_review_shortlist_top25': shortlist[:25],
            'recent_viability_states': {state: sum(r['viability_state'] == state for r in ranked)
                                        for state in sorted({r['viability_state'] for r in ranked})},
            'swing_states': {state: sum(r['swing_state'] == state for r in ranked)
                             for state in sorted({r['swing_state'] for r in ranked})},
            'v06_opportunity_top': v06[:25],
            'v06_verified_eligible': 0,
            'research_only': True,
            'production_approved': False,
            'history_provenance': 'restored original full-universe GitHub Actions cache',
          }
          (root/'identity_rescore_report.json').write_text(json.dumps(report,indent=2)+'\n')
          print('IDENTITY_GATE_VERIFIED', json.dumps(report))
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('# OFTS identity-aware full-universe rescore\n\n')
              f.write('IQMX excluded: '+iqmx['status']+'; post-event bars '+iqmx['bars']+' of '+iqmx['raw_bars']+' raw.\n\n')
              f.write('Top 10 research rankings (not BUY signals):\n\n')
              for r in ranked[:10]:
                  f.write('- '+r['rank']+' '+r['symbol']+' '+r['score']+' ('+r['status']+'), swing '+r['swing_state']+', viability '+r['viability_state']+', combined '+r['combined_research_entry']+'\n')
              f.write('\nExperimental recent-swing review shortlist (NOT BUY): '+str(len(shortlist))+'\n')
              f.write('\nPrimary v0.6 opportunity research ranking (out of 80; eligibility pending):\n')
              for r in v06[:10]:
                  f.write('- '+r['opportunity_rank']+' '+r['symbol']+' '+r['opportunity_v06_score']+'/80; v2.3 benchmark '+r['score']+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ofts-identity-rescored-${{ github.run_id }}
          path: |
            ofts-output/v23_research_universe.csv
            ofts-output/v23_research_ranked.csv
            ofts-output/v23_research_recent_viability_shortlist.csv
            ofts-output/v06_opportunity_research_ranked.csv
            ofts-output/status.json
            ofts-output/identity_rescore_report.json
          if-no-files-found: warn
          retention-days: 90
