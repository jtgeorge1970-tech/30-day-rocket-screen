name: Engine 4 Provider Diagnostic
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/engine4-provider-diagnostic.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Probe Nasdaq quote and premarket endpoints plus Google News RSS
        shell: bash
        run: |
          python - <<'PY'
          import json, requests, xml.etree.ElementTree as ET
          from urllib.parse import quote_plus

          H={
            'Accept':'application/json, text/plain, */*',
            'Accept-Language':'en-US,en;q=0.9',
            'Origin':'https://www.nasdaq.com',
            'Referer':'https://www.nasdaq.com/',
            'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/138 Safari/537.36',
          }
          for s in ['CRCL','NVDA','ORCL']:
            for kind,url in [
              ('info',f'https://api.nasdaq.com/api/quote/{s}/info?assetclass=stocks'),
              ('premarket',f'https://api.nasdaq.com/api/quote/{s}/extended-trading?assetclass=stocks&markettype=pre'),
            ]:
              try:
                r=requests.get(url,headers=H,timeout=12)
                print('\n',s,kind,'HTTP',r.status_code,'LEN',len(r.text))
                print(r.text[:5000])
              except Exception as e:
                print(s,kind,'ERROR',repr(e))
            q=quote_plus(f'"{s}" stock when:2d')
            url=f'https://news.google.com/rss/search?q={q}&hl=en-US&gl=US&ceid=US:en'
            try:
              r=requests.get(url,headers={'User-Agent':H['User-Agent']},timeout=12)
              root=ET.fromstring(r.content)
              items=root.findall('.//item')[:3]
              print(s,'GOOGLE_NEWS',r.status_code,[(i.findtext('title'),i.findtext('pubDate')) for i in items])
            except Exception as e:
              print(s,'GOOGLE_NEWS_ERROR',repr(e))
          PY
